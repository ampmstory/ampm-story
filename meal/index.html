<!doctype html><html><head>
<meta name="robots" content="noindex">
<script>window.AMPM_SALE=true;</script><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>식비절약 식단 플래너</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 굿노트 서식과 같은 브라운 알약 탭바 + 크림 바탕, 탭마다 서식 페이지 구성을 그대로 옮긴 카드 */
:root{
  --bg:#FFFEF1; --surface:#FFFFFB; --sunk:#F6F2E6; --ink:#4A433E; --muted:#8C8278; --line:#CFC7BA; --dot:#D9D2C6;
  --brown:#735D4F; --brown-ink:#FFFFFF; --glow:#FFE38A;
  --lime:#D4F36C; --sky:#68D1E2; --yellow:#FFDF6A; --pink:#FF8D88; --on-accent:#3F3732;
  --danger:#D2483F; --good:#4E9A3C;
  --f-display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#221E1B; --surface:#2C2723; --sunk:#36302B; --ink:#F2ECE4; --muted:#B5AA9E; --line:#4E463F; --dot:#4A433C;
  --brown:#4B3D34; --brown-ink:#F7EFE6; --glow:#E9C95E;
  --lime:#C3E25C; --sky:#5CC2D3; --yellow:#F1CF5B; --pink:#F08079; --on-accent:#2E2722;
  --danger:#FF7A70; --good:#8FD07A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#221E1B; --surface:#2C2723; --sunk:#36302B; --ink:#F2ECE4; --muted:#B5AA9E; --line:#4E463F; --dot:#4A433C;
  --brown:#4B3D34; --brown-ink:#F7EFE6; --glow:#E9C95E;
  --lime:#C3E25C; --sky:#5CC2D3; --yellow:#F1CF5B; --pink:#F08079; --on-accent:#2E2722;
  --danger:#FF7A70; --good:#8FD07A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--sky);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px 10px;display:grid;gap:8px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:1.35rem;letter-spacing:.01em;color:var(--ink)}
.brand h1 small{font-size:.78rem;background:var(--lime);color:var(--on-accent);border-radius:99px;padding:2px 10px;margin-right:6px;vertical-align:3px}
.store{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.store i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.store.cloud i{background:var(--good)}
.tabs{background:var(--brown);border-radius:16px;padding:5px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;border:0;background:transparent;color:var(--brown-ink);font-family:var(--f-display);font-size:1.05rem;padding:7px 14px;border-radius:12px;white-space:nowrap}
.tab[aria-selected="true"]{background:radial-gradient(ellipse at 50% 40%,#FFF3B8,var(--glow) 70%);color:#5A4636;box-shadow:inset 0 0 0 1.5px rgba(90,70,54,.35)}

/* generic */
h2.sec{font-family:var(--f-display);font-weight:400;font-size:1.15rem;margin:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.stack{display:grid;gap:14px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.box>.cap{font-family:var(--f-display);font-size:.98rem;text-align:center;padding:5px 10px;color:var(--on-accent);border-bottom:1px solid var(--line)}
.box>.in{padding:10px 12px}
.c-lime{background:var(--lime)} .c-sky{background:var(--sky)} .c-yellow{background:var(--yellow)} .c-pink{background:var(--pink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:.9rem}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--brown);color:var(--brown-ink);border-color:transparent}
.btn.warn{color:var(--danger);border-color:var(--danger)}
.btn.sm{padding:3px 10px;font-size:.82rem}
.x{border:0;background:transparent;color:var(--muted);font-size:1.05rem;line-height:1;padding:4px 6px;border-radius:8px}
.x:hover{color:var(--danger);background:var(--sunk)}
.field{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;min-width:0}
.field:focus{border-color:var(--sky)}
textarea.field{width:100%;resize:vertical;min-height:84px}
.under{border:0;border-bottom:1px dotted var(--dot);background:transparent;border-radius:0;padding:6px 4px;width:100%;min-width:0}
.under:focus{outline:none;border-bottom:1.5px solid var(--sky)}
.seg{display:inline-flex;background:var(--sunk);border-radius:99px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:99px;padding:5px 14px;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 11px;font-size:.86rem}
.chip[aria-pressed="true"]{background:var(--yellow);color:var(--on-accent);border-color:transparent}
.nav{display:flex;align-items:center;gap:6px}
.nav b{font-family:var(--f-display);font-weight:400;font-size:1.05rem;min-width:9.5em;text-align:center}
.nav .x{font-size:1.2rem;color:var(--ink)}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.empty{color:var(--muted);font-size:.88rem;padding:10px 4px;text-align:center}
.datebar{font-size:.85rem;color:var(--muted);border-bottom:1px solid var(--line);padding:2px 6px 4px;min-width:9em}
.note{background:var(--sunk);border-radius:14px;padding:10px 14px;font-size:.88rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.note.sample{background:color-mix(in srgb,var(--yellow) 35%,var(--surface));color:var(--ink)}
.toast{z-index:40!important;position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--brown);color:var(--brown-ink);padding:8px 16px;border-radius:99px;font-size:.88rem;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1}
main{margin-top:10px}

/* fridge */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.86rem}
.st{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:.78rem;font-weight:700;color:var(--on-accent);flex:none;border:0;padding:0}
.st.first{background:var(--yellow)} .st.soon{background:var(--pink)} .st.check{background:var(--sky)} .st.ok{background:transparent;box-shadow:inset 0 0 0 2.5px var(--lime);color:var(--ink)}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.item{display:flex;align-items:center;gap:8px;padding:6px 2px;border-bottom:1px dotted var(--dot)}
.item:last-child{border-bottom:0}
.item .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.dday{font-size:.78rem;color:var(--muted);white-space:nowrap}
.dday.hot{color:var(--danger);font-weight:700}
.addbar{display:grid;grid-template-columns:minmax(0,2fr) auto auto auto auto;gap:8px;align-items:center}

/* meals */
.week{display:grid;grid-template-columns:52px repeat(4,minmax(0,1fr));gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.week .h{font-family:var(--f-display);text-align:center;padding:6px 4px;background:var(--yellow);color:var(--on-accent);font-size:.95rem;border-bottom:1px solid var(--line)}
.week .h.d{background:var(--lime)}
.week .day{display:grid;place-items:center;font-family:var(--f-display);border-bottom:1px dotted var(--dot);padding:6px 2px;line-height:1.2;text-align:center}
.week .day small{display:block;font-family:var(--f-body);font-size:.72rem;color:var(--muted)}
.week .day.today{color:var(--danger)}
.week .cell{border-bottom:1px dotted var(--dot);border-left:1px dotted var(--dot);padding:4px 6px}
.week .cell .under{border-bottom:0}
.week .lab{display:none}
.month-top{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cal .h{font-family:var(--f-display);text-align:center;padding:5px;border-bottom:1px solid var(--line);font-size:.92rem}
.cal .h.sat{color:#2F7FD0} .cal .h.sun{color:var(--danger)}
.cal .d{min-height:84px;border-right:1px dotted var(--dot);border-bottom:1px dotted var(--dot);padding:5px 6px;text-align:left;background:transparent;border-top:0;border-left:0;font-size:.78rem;display:flex;flex-direction:column;gap:2px;min-width:0}
.cal .d:nth-child(7n){border-right:0}
.cal .d .n{font-weight:700;font-size:.82rem}
.cal .d.out{opacity:.35}
.cal .d.today .n{background:var(--pink);color:var(--on-accent);border-radius:99px;padding:0 6px;align-self:flex-start}
.cal .d .m{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.cal .d:hover{background:var(--sunk)}
.tag{display:inline-block;border-radius:99px;padding:1px 9px;font-size:.82rem;background:var(--sunk);margin:2px 3px 2px 0}
.tag.hot{background:color-mix(in srgb,var(--pink) 40%,var(--surface))}

/* shop */
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.chk{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dotted var(--dot)}
.chk:last-child{border-bottom:0}
.chk input{width:18px;height:18px;accent-color:var(--brown);flex:none}
.chk label{flex:1;min-width:0;overflow-wrap:anywhere}
.chk.done label{text-decoration:line-through;color:var(--muted)}
.auto{font-size:.7rem;background:var(--sunk);color:var(--muted);border-radius:6px;padding:0 5px;margin-left:4px}

/* recipes */
.rgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:12px;align-items:start}
.rtable{width:100%;border-collapse:collapse}
.rtable th{background:var(--pink);color:var(--on-accent);font-weight:400;font-family:var(--f-display);padding:6px;font-size:.92rem}
.rtable td{padding:7px 6px;border-bottom:1px solid var(--sunk);font-size:.9rem}
.rtable tr.sel td{background:color-mix(in srgb,var(--yellow) 30%,var(--surface))}
.rtable tbody tr{cursor:pointer}
.rtable tbody tr:hover td{background:var(--sunk)}
.stars{display:inline-flex;gap:1px;color:var(--yellow)}
.stars button{border:0;background:transparent;font-size:1.35rem;padding:0 1px;color:var(--line);line-height:1}
.stars button.on{color:#F0B92B}
.rhead{display:grid;grid-template-columns:minmax(0,1.4fr) auto minmax(0,.8fr);gap:10px;align-items:center;border:1px solid var(--line);border-radius:22px;padding:8px 14px}
.have{color:var(--good);font-size:.8rem}

/* spend */
.sform{display:grid;grid-template-columns:auto minmax(0,2fr) auto auto minmax(0,1fr) minmax(0,1.2fr) auto;gap:8px;align-items:center}
.slist{display:grid}
.srow{display:grid;grid-template-columns:62px minmax(0,2fr) 76px 70px 104px minmax(0,1.2fr) 30px;gap:8px;align-items:center;padding:7px 8px;border-bottom:1px dotted var(--dot);font-size:.9rem}
.srow.head{font-family:var(--f-display);font-size:.92rem;border-bottom:1px solid var(--line);background:var(--lime);color:var(--on-accent)}
.srow.head .b{background:transparent}
.srow:not(.head){cursor:pointer}
.srow:not(.head):hover{background:var(--sunk)}
.srow.edit{background:color-mix(in srgb,var(--sky) 22%,var(--surface))}
.srow .amt{text-align:right}
.pill{display:inline-block;border-radius:99px;padding:0 9px;font-size:.8rem;color:var(--on-accent)}
.p-장보기{background:var(--lime)} .p-외식{background:var(--pink)} .p-간식{background:var(--yellow)} .p-배달{background:var(--sky)} .p-기타{background:var(--sunk);color:var(--ink)}
.total{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:99px;padding:4px 18px 4px 4px;background:var(--surface)}
.total b{background:var(--yellow);color:var(--on-accent);border-radius:99px;padding:8px 18px;font-family:var(--f-display);font-weight:400}
.total span{font-size:1.25rem;font-family:var(--f-display)}

/* report */
.months{display:flex;flex-wrap:wrap;gap:5px}
.mo{width:38px;height:38px;border-radius:50%;border:2px solid var(--lime);background:var(--surface);font-weight:700;font-size:.85rem}
.mo[aria-pressed="true"]{background:var(--lime);color:var(--on-accent)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:22px;padding:10px 16px;background:var(--surface);min-width:0}
.kpi .l{font-size:.86rem;font-weight:700}
.kpi .v{font-family:var(--f-display);font-size:1.5rem;margin-top:2px}
.kpi .v.neg{color:var(--danger)}
.kpi input{width:100%;font-family:var(--f-display);font-size:1.4rem;border:0;border-bottom:1px dotted var(--dot);background:transparent;padding:0}
.kpi input:focus{outline:none;border-bottom-color:var(--sky)}
.cols3b{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr);gap:10px}
.catline{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 2px;border-bottom:1px dotted var(--dot);font-size:.9rem}
.bar{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.sumline{background:var(--yellow);color:var(--on-accent);border-radius:99px;padding:6px 16px;display:flex;justify-content:space-between;font-family:var(--f-display);font-size:1.1rem;margin-top:8px}
.q{display:grid;gap:4px;margin-bottom:10px}
.q>span{font-size:.86rem;text-align:center;color:var(--muted)}
.q .auto-v{border:1px solid var(--line);border-radius:99px;padding:8px 12px;text-align:center;font-family:var(--f-display);min-height:40px}
.q input{border:1px solid var(--line);border-radius:99px;padding:8px 14px;text-align:center;background:var(--surface);width:100%}
.counts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;text-align:center}
.counts div{padding:8px 4px;border-right:1px solid var(--sunk)}
.counts div:last-child{border-right:0}
.counts b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.45rem}
.rev3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rev2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.box textarea.bare{border:0;background:transparent;width:100%;min-height:96px;resize:vertical;padding:0}
.box textarea.bare:focus{outline:none}
.hgrid-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.hgrid{border-collapse:collapse;font-size:.8rem}
.hgrid th{background:var(--sky);color:var(--on-accent);font-weight:700;padding:5px 0;min-width:26px}
.hgrid th.hn{min-width:110px;text-align:left;padding-left:10px;position:sticky;left:0;z-index:1}
.hgrid td{border:1px dotted var(--dot);text-align:center;padding:0}
.hgrid td.hn{text-align:left;padding:4px 10px;white-space:nowrap;position:sticky;left:0;background:var(--surface);font-weight:700;z-index:1}
.hgrid td.cnt{font-weight:700;padding:0 8px}
.hc{width:26px;height:28px;border:0;background:transparent;display:grid;place-items:center;padding:0}
.hc.on::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--lime);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--on-accent) 25%,transparent)}
.hgrid td.wk{background:var(--sunk)}
.foot{margin-top:28px;display:grid;gap:10px;font-size:.84rem;color:var(--muted)}
details.backup summary{cursor:pointer}
details.backup .in{display:grid;gap:8px;margin-top:8px}
.confirm{display:inline-flex;gap:6px;align-items:center}


/* export dialog */
.exbtn{border:0;background:var(--brown);color:var(--brown-ink);border-radius:99px;padding:5px 14px;font-size:.86rem;font-family:var(--f-display)}
.overlay{position:fixed;inset:0;background:rgba(40,30,24,.42);z-index:30;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg{background:var(--surface);color:var(--ink);border-radius:22px;width:min(560px,100%);max-height:100%;overflow:auto;padding:18px 18px 16px;display:grid;gap:14px;border:1px solid var(--line)}
.dlg h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:1.25rem}
.exlist{display:grid;gap:6px}
.exrow{display:grid;grid-template-columns:22px minmax(0,1fr) auto;align-items:center;gap:8px;padding:7px 10px;border-radius:12px;background:var(--sunk)}
.exrow input{width:18px;height:18px;accent-color:var(--brown)}
.exrow .per{font-size:.8rem;color:var(--muted)}
.exnavs{display:grid;gap:6px;justify-items:start}
.exstat{font-size:.88rem;color:var(--muted);min-height:1.4em}
#print{position:absolute;left:-30000px;top:0;width:1316px;pointer-events:none}

/* overlay pages drawn on top of the original planner PDF (fixed light palette) */
.ovp{position:relative;width:1316px;height:911px;background:transparent;font-family:"Gowun Dodum","Malgun Gothic",sans-serif;color:#4A433E}
.ovp .t{position:absolute;display:flex;overflow:hidden;line-height:1.3}
.ovp .t>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.ovp .w{position:absolute;overflow:hidden;white-space:pre-wrap;line-height:1.55;word-break:keep-all;overflow-wrap:anywhere}
.ovp .J{font-family:"Jua","Gowun Dodum",sans-serif}
.ovp .badge{position:absolute;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#3F3732}
.ovp .ring{position:absolute;border-radius:50%;border:3.5px solid #735D4F}
.ovp .dot{position:absolute;border-radius:50%;background:#B7DB3E}
.ovp .tag{display:inline-block;background:#F3EEE2;border-radius:99px;padding:1px 11px;margin:0 6px 6px 0;font-size:16px}
.ovp .tag.hot{background:#FFD6D3}


/* sample banner */
.samplebar{margin-top:10px;background:var(--yellow);color:var(--on-accent);border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;box-shadow:0 0 0 2px var(--brown) inset}
.samplebar b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.15rem}
.samplebar span{font-size:.9rem}
.samplebar .sb-btns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn.big{padding:10px 20px;font-size:1rem;font-family:var(--f-display)}
.samplebar .btn.warn{background:var(--surface)}
@media (max-width:640px){.samplebar>.btn.big{width:100%}}
.rcbtn{width:100%;border-style:dashed;background:var(--sunk)}
.rcpaste summary{cursor:pointer;padding:6px 0}
.rcpaste .rc-help{margin:4px 0 8px;line-height:1.6}
.rcpaste textarea{min-height:110px;margin-bottom:6px}
.rcitems{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;max-height:260px;overflow:auto}

<script>
/* ---------- constants ---------- */
const TABS=[["today","오늘"],["meals","식단"],["shop","장보기"],["fridge","냉장고"],["recipes","Best레시피"],["money","가계부"]];

const KW={
 채소:"양파 대파 쪽파 마늘 감자 고구마 당근 배추 양배추 알배추 애호박 단호박 오이 상추 깻잎 시금치 콩나물 숙주 버섯 팽이버섯 표고 새송이 브로콜리 파프리카 청양고추 고추 토마토 가지 부추 청경채 양상추 생강 무 연근 우엉",

 수산:"고등어 연어 새우 오징어 멸치 참치 조개 바지락 굴 갈치 명태 동태 어묵 김 미역 다시마 낙지 주꾸미 꽃게 맛살",
 과일:"사과 바나나 딸기 귤 오렌지 포도 키위 수박 참외 레몬 블루베리 복숭아 감 자두 망고",

 식료품:"쌀 계란 달걀 두부 우유 간장 된장 고추장 고춧가루 설탕 소금 식용유 참기름 들기름 밀가루 부침가루 튀김가루 라면 국수 소면 파스타 스파게티 치즈 버터 케첩 마요네즈 김치 떡 당면 올리고당 식초 굴소스 카레 전분 생크림 순두부",

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);

const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const monday=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const ym=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const won=n=>(Math.round(n)||0).toLocaleString("ko-KR")+"원";
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const today=()=>iso(new Date());
const guessCat=name=>{for(const[w,c]of KWLIST){if(name.includes(w))return c}return "기타"};
const SKIPW=/^(다진|손질한?|깐|냉동|생|국산|수입|자른|썬|채썬|편썬|삶은|데친|구운|볶은|말린|불린|통|작은|큰|신선한|잘게)$/;
const core=line=>{const toks=line.replace(/\(.*?\)/g," ").replace(/[\d./~]+\s*(kg|g|ml|l|개|큰술|작은술|숟가락|스푼|컵|쪽|줌|모|장|대|마리|봉지|봉|팩|알|T|t)?/gi," ").replace(/약간|적당량|조금|약|반/g," ").trim().split(/\s+/).filter(Boolean);
  for(const t of toks){for(const[w]of KWLIST)if(t.includes(w))return w}return toks.find(t=>!SKIPW.test(t))||toks[0]||""};

/* ---------- state & storage ---------- */
const KEYS=["meta","fridge","meals","recipes","shop","spend","budget","habits","review","monthly","prefs","themes"];
const LS="ampm-meal-planner-v1";
function blank(){return{meta:{sample:false,v:1},fridge:[],meals:{},recipes:[],shop:[],spend:[],budget:{},habits:{},review:{},monthly:{},prefs:{people:2,kids:false,avoid:"",like:""},themes:{}}}
let S=blank();
function loadLocal(){try{const r=localStorage.getItem(LS);return r?JSON.parse(r):null}catch(e){return null}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
let col=null,dirty=new Set(),saveT=null,busy=false;
function save(...ks){ks.forEach(k=>dirty.add(k));saveLocal();clearTimeout(saveT);saveT=setTimeout(flush,700)}
async function flush(){if(!col){dirty.clear();return}if(busy){saveT=setTimeout(flush,400);return}busy=true;const ks=[...dirty];dirty.clear();
  for(const k of ks){try{await col.doc(k).set({v:S[k],t:Date.now()})}catch(e){setStore(false)}}busy=false}
function setStore(cloud){const el=$("#store");el.classList.toggle("cloud",cloud);el.lastElementChild.textContent=cloud?"계정에 저장 · 기기 연동":"이 기기에만 저장";
  const m=$("#sync-msg");const inClaude=!!(window.claude&&typeof window.claude.use==="function");
  if(m&&!cloud&&!inClaude){m.innerHTML=`지금은 <b>이 기기(브라우저)에만</b> 저장돼요. <b>Claude와 연동</b>하면 폰·패드·PC 기록이 자동으로 맞춰지고, 영수증 사진 읽기도 쓸 수 있어요. (무료 계정도 돼요)<br><a class="btn sm pri" style="display:inline-block;margin-top:6px;text-decoration:none" href="${APP_URL}" target="_blank" rel="noopener">Claude와 연동하기</a> <span class="small muted">기존 기록은 '파일로 저장' → 연동한 화면에서 '파일 불러오기'</span>`;return}
  if(m)m.innerHTML=cloud?"claude.ai 계정에 저장되고 있어요. 같은 계정으로 열면 폰·패드·PC 어디서든 기록이 그대로 이어져요.":"지금은 <b>이 기기(브라우저)에만</b> 저장돼요. claude.ai에 로그인해서 열면 기기끼리 자동으로 맞춰져요. 로그인 없이 쓸 때는 <b>파일로 저장</b> → 다른 기기에서 <b>파일 불러오기</b>로 옮기세요."}
async function connectDB(){
  try{
    if(!window.claude||typeof window.claude.use!=="function")return;
    const[db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user)return;const id=await user.id();if(!id)return;
    const c=db.collection("data/users/"+id);
    const res=await Promise.race([Promise.all(KEYS.map(k=>c.doc(k).get().catch(()=>null))),new Promise(r=>setTimeout(()=>r(null),10000))]);
    if(!res)return;
    const any=res.some(s=>s&&s.exists);
    if(any){KEYS.forEach((k,i)=>{const s=res[i];if(s&&s.exists){const d=s.data();if(d&&"v" in d)S[k]=JSON.parse(JSON.stringify(d.v))  /* 계정 저장소 데이터는 읽기전용이라 복사해서 씀 */}});dedupeFridge();saveLocal();renderAll()}
    col=c;setStore(true);if(!any){KEYS.forEach(k=>dirty.add(k));flush()}
  }catch(e){}
}

  if(S.meta.onboard){document.body.classList.add("onb");$("#tabs").innerHTML=OB_STEPS.map((l,i)=>`<button class="tab" aria-selected="${V.ob===i}" ${i>V.obMax?"disabled":""} data-act="ob-go" data-v="${i}">${l}</button>`).join("");$("#banner").innerHTML="";$("#main").innerHTML=rOnboard();$("#overlay").innerHTML=rExport()||rRecipeView()||rReceipt()||rAI()||rCopy();return}
  document.body.classList.remove("onb");$("#tabs").innerHTML=TABS.map(([k,l])=>`<button class="tab" role="tab" aria-selected="${V.tab===k}" data-act="tab" data-v="${k}">${l}</button>`).join("");
  $("#banner").innerHTML=S.meta.sample?`<div class="samplebar"><div><b>📌 지금 보이는 기록은 모두 예시예요</b><span>둘러본 뒤 아래 버튼을 눌러 지우고 내 기록을 시작하세요.</span></div>${V.confirm==="sample"?`<div class="sb-btns"><span>예시와 함께 <b style="display:inline;font-size:inherit">지금까지 직접 입력한 기록도 같이 지워져요.</b> 지울까요?</span><button class="btn warn big" data-act="sample-clear-yes">네, 지우기</button><button class="btn big" data-act="cancel">취소</button></div>`:`<button class="btn pri big" data-act="sample-clear">🧹 예시 지우고 시작하기</button>`}</div>`:"";
  const r={today:rToday,fridge:rFridge,meals:rMeals,shop:rShop,recipes:rRecipes,money:rMoney}[V.tab];
  $("#main").innerHTML=r()+`<datalist id="rlist">${allRecipes().map(r=>`<option value="${esc(r.name)}">`).join("")}</datalist>`;
  markCell();
  $("#overlay").innerHTML=rExport()||rRecipeView()||rReceipt()||rAI()||rCopy()||rPicker()||rCheckout()||rSettings();
}
function monthNav(){const[y,m]=V.month.split("-").map(Number);return `<div class="nav"><button class="x" data-act="mon" data-v="-1" aria-label="이전 달">‹</button><b>${y}년 ${m}월</b><button class="x" data-act="mon" data-v="1" aria-label="다음 달">›</button>${V.month!==ym(new Date())?`<button class="nowbtn" data-act="mon-now">이번 달</button>`:""}</div>`}
function weekNav(){return `<div class="nav"><button class="x" data-act="wk" data-v="-1" aria-label="이전 주">‹</button><b>${weekLabel(parse(V.week))}</b><button class="x" data-act="wk" data-v="1" aria-label="다음 주">›</button>${V.week!==iso(monday(new Date()))?`<button class="nowbtn" data-act="wk-now">이번 주</button>`:""}</div>`}
function dday(date){if(!date)return"";const n=Math.round((parse(date)-parse(today()))/864e5);return `<span class="dday ${n<=2?"hot":""}">${n<0?`D+${-n}`:n===0?"D-day":`D-${n}`}</span>`}

/* 0. 오늘 */
function startChecklist(){
  if(S.meta.checkHide||S.meta.sample)return "";const m=ym(new Date());
  const items=[["우리집 설정",!!(S.prefs&&S.prefs.set),"setup"],["이번 달 예산",!!S.budget[m],"setup"],["냉장고 채우기",S.fridge.length>=3,"fridge"],["첫 식단 넣기",Object.values(S.meals).some(x=>x.b||x.l||x.d),"meals"],["첫 지출 기록",S.spend.length>0,"today"],["굿노트 플래너로 옮기기",!!S.meta.planner,"planner"]];
  const done=items.filter(x=>x[1]).length;if(done===items.length)return "";
  return `<section class="box ckl"><div class="cap c-sky">시작 체크리스트 <span class="num">${done}/${items.length}</span><button class="x tx2" data-act="ck-hide" aria-label="체크리스트 숨기기">×</button></div><div class="in">
   <div class="bar big" style="margin-bottom:8px"><i style="width:${Math.round(done/items.length*100)}%;background:var(--sky)"></i></div>
   <div class="chips">${items.map(([l,ok,go])=>ok?`<span class="chip done">✓ ${l}</span>`:`<button class="chip" data-act="ck-go" data-v="${go}">${l} ›</button>`).join("")}</div>
   ${V.ckPick?`<div class="row" style="margin-top:8px;gap:6px"><button class="btn sm pri" data-act="ck-pdf">📄 PDF로 저장</button><button class="btn sm" data-act="ck-copy">✍️ 손글씨로 옮겨 쓰기</button></div>`:""}</div></section>`;
}
function pickRow(){const rec=recommend().map(x=>x.r);const all=[...rec,...S.recipes.filter(r=>!rec.includes(r)),...STARTER.filter(t=>!rec.includes(t)&&!S.recipes.some(r=>r.name===t.name))].slice(0,16);
  return all.length?`<div class="pick"><span class="small muted">칸을 누르고 메뉴를 고르면 바로 들어가요 <span class="rec-k">★ 먼저 먹을 재료 활용</span></span><div class="chips">${all.map(r=>`<button type="button" class="chip ${rec.includes(r)?"rec":""}" data-act="pick" data-v="${esc(r.name)}">${rec.includes(r)?"★ ":""}${esc(r.name)}</button>`).join("")}</div></div>`:""}
function markCell(){document.querySelectorAll('[data-bind="meal"].next').forEach(x=>x.classList.remove("next"));const c=V.lastCell;if(!c)return;const el=document.querySelector(`[data-bind="meal"][data-d="${c.d}"][data-k="${c.k}"]`);if(el)el.classList.add("next")}
function rToday(){
  const t=today(),d=parse(t),me=S.meals[t]||{},urg=urgentItems(),m=ym(d);
  const used=monthSpend(m).reduce((a,s)=>a+s.amount,0),bud=S.budget[m]||0,pct=bud?Math.min(100,Math.round(used/bud*100)):0;
  const todays=S.spend.filter(s=>s.date===t),hm=S.habits[m]||{};
  const up=urgentPlan(d,1);
  return `<div class="stack">${summaryCards()}${startChecklist()}
  <div class="row spread"><h2 class="sec">${d.getMonth()+1}월 ${d.getDate()}일 ${WD[(d.getDay()+6)%7]}요일</h2><button class="btn sm" data-act="tab" data-v="meals">이번 주 식단 ›</button></div>${themeText(d)?`<div class="thline">이번 주 컨셉 · <b>${esc(themeText(d))}</b></div>`:""}
  <div class="today-top">
   <section class="box"><div class="cap c-lime">오늘의 식단</div><div class="in">${[["b","아침"],["l","점심"],["d","저녁"]].map(([k,l])=>`<div class="item"><span class="lab2">${l}</span><input class="under" data-bind="meal" data-d="${t}" data-k="${k}" value="${esc(me[k])}" placeholder="메뉴 입력" aria-label="오늘 ${l}">${findRecipe(me[k])?`<button class="pickbtn" data-act="rv-open" data-v="${esc(me[k])}" aria-label="${esc(me[k])} 레시피">📖</button>`:""}<button class="pickbtn" data-act="pk-open" data-d="${t}" data-k="${k}">${me[k]?"바꾸기":"고르기"}</button></div>`).join("")}${up.length?`<div class="urgsug"><span>★ 급한 재료(${up[0].uses.map(esc).join(", ")})로 <b>${esc(up[0].name)}</b> 어때요?</span><button class="btn sm pri" data-act="urg-today">오늘 ${up[0].m==="d"?"저녁":"점심"}에 넣기</button></div>`:""}</div></section>
   <section class="box"><div class="cap c-pink">먼저 먹을 재료</div><div class="in"><button class="btn rcbtn" data-act="ai-open" data-v="rec" style="margin-bottom:8px">🍳 냉장고 재료로 뭐 해먹지?</button>${urg.length?`<div class="eatlist">${urg.map(f=>`<button class="eat ${f.status==="soon"?"hot":""}" data-act="f-eat" data-id="${f.id}" aria-label="${esc(f.name)} 다 먹음"><span>${esc(f.name)}${qtyTxt(f)}</span>${dday(f.date)}<i>✓</i></button>`).join("")}</div><div class="small muted" style="margin-top:6px">다 먹은 재료를 누르면 냉장고에서 빠져요. 잘못 누르면 되돌리기</div>`:`<div class="empty">급하게 먹을 재료가 없어요</div>`}</div></section>
  </div>
  <section class="box"><div class="cap c-yellow">이번 달 식비</div><div class="in stack" style="gap:10px">
   <div class="row spread"><span>사용 <b class="num">${won(used)}</b></span>${bud?`<span>남은 금액 <b class="num ${bud-used<0?"neg":""}">${won(bud-used)}</b></span>`:`<button class="btn sm" data-act="go-settle">예산 정하기</button>`}</div>
   ${bud?`<div class="bar big"><i style="width:${pct}%;background:${used>bud?"var(--danger)":"var(--lime)"}"></i></div>`:""}
   ${spendForm(true)}
   ${todays.length?`<div class="tlist"><div class="row spread"><b class="small">오늘 기록 ${todays.length}건 · <span class="num">${won(todays.reduce((a,s)=>a+s.amount,0))}</span></b><button class="btn sm" data-act="go-list">이번 달 전체 보기 ›</button></div>${todays.slice().reverse().map(s=>`<div class="item"><span class="pill p-${s.cat}">${s.cat}</span><span class="nm">${esc(s.desc)}</span><span class="num">${won(s.amount)}</span><button class="x" data-act="sp-del" data-id="${s.id}" aria-label="삭제">×</button></div>`).join("")}</div>`:`<div class="small muted">기록하면 오늘 쓴 내역이 여기 바로 보여요. 이번 달 전체는 가계부 탭에서 볼 수 있어요.</div>`}
  </div></section>

  </div>`;
}

/* 1. 냉장고 */
function rFridge(){
  const cnt=k=>S.fridge.filter(f=>f.status===k).length;
  return `<div class="stack">
  <div class="row spread"><div class="legend">${ST_ORDER.map(k=>`<span class="row" style="gap:6px"><span class="st ${k}">${STATUS[k][0]}</span>${STATUS[k][1]} <span class="muted num">${cnt(k)}</span></span>`).join("")}</div>
  <span class="small muted">아이콘을 누르면 상태가 바뀌어요</span></div>
  <form class="addbar" id="f-add">
    <input class="field wide" id="f-name" placeholder="재료 이름 · 여러 개는 쉼표로 (예: 두부, 계란, 대파)" autocomplete="off" required>
    <select class="field" id="f-zone" aria-label="보관 위치"><option value="">위치 자동</option>${ZONES.map(z=>`<option>${z}</option>`).join("")}</select>
    <select class="field" id="f-status">${ST_ORDER.map(k=>`<option value="${k}" ${k==="ok"?"selected":""}>${STATUS[k][1]}</option>`).join("")}</select>
    <input class="field" type="date" id="f-date" aria-label="유통기한">
    <button class="btn pri" type="submit">넣기</button>
  </form>
  <div class="cols3">${ZONES.map(z=>{const it=S.fridge.filter(f=>f.zone===z).sort((a,b)=>ST_ORDER.indexOf(a.status)-ST_ORDER.indexOf(b.status));
    return `<section class="box"><div class="cap c-${ZONE_C[z]}">${z} <span class="num small">${it.length}</span></div><div class="in">${it.length?it.map(f=>`<div class="item"><button class="st ${f.status}" data-act="f-cycle" data-id="${f.id}" title="${STATUS[f.status][1]}" aria-label="상태: ${STATUS[f.status][1]}">${STATUS[f.status][0]}</button><span class="nm">${esc(f.name)}</span>${(f.qty||1)>1?`<span class="qstep"><button data-act="f-dec" data-id="${f.id}" aria-label="${esc(f.name)} 1개 빼기">−</button><b class="num">${f.qty}</b><button data-act="f-inc" data-id="${f.id}" aria-label="1개 더하기">+</button></span>`:""}${dday(f.date)}<select class="field small" style="padding:2px 4px" data-act="f-move" data-id="${f.id}" aria-label="보관 위치">${ZONES.map(o=>`<option ${o===z?"selected":""}>${o}</option>`).join("")}</select><button class="x" data-act="f-del" data-id="${f.id}" aria-label="삭제">×</button></div>`).join(""):`<div class="empty">비어 있어요</div>`}</div></section>`}).join("")}</div>
  </div>`;
}

/* 2. 식단 */
function rMeals(){
  return `<div class="stack"><div class="row spread"><div class="seg"><button aria-pressed="${V.mealView==="week"}" data-act="mv" data-v="week">주간식단</button><button aria-pressed="${V.mealView==="month"}" data-act="mv" data-v="month">월간식단</button></div>${V.mealView==="week"?weekNav():monthNav()}</div>${V.mealView==="week"?rWeek():rMonth()}</div>`;
}
function rWeek(){
  const mon=parse(V.week),t=today();
  let h=`${themeBar()}<div class="note"><span class="small">칸을 누른 뒤 '메뉴 고르기'로 레시피에서 골라 넣을 수 있어요.</span><span class="row" style="gap:6px"><button class="btn sm" data-act="urg-week">🔥 급한 재료부터 채우기</button><button class="btn sm" data-act="pk-open" data-v="sel">🍽 메뉴 고르기</button><button class="btn sm" data-act="copy-week">지난주 식단 가져오기</button><button class="btn sm pri" data-act="ai-open" data-v="week">📅 이번 주 식단 짜줘</button></span></div>

  <div class="week"><div class="h d">요일</div><div class="h">아침</div><div class="h">점심</div><div class="h">저녁</div><div class="h">실제 메뉴</div>`;
  for(let i=0;i<7;i++){const d=iso(addDays(mon,i)),m=S.meals[d]||{};const dd=addDays(mon,i);
    h+=`<div class="day ${d===t?"today":""}">${WD[i]}<small>${dd.getMonth()+1}/${dd.getDate()}</small></div>`;
    [["b","아침"],["l","점심"],["d","저녁"],["a","실제 메뉴"]].forEach(([k,l],j)=>h+=`<div class="cell ${j===3?"last":""}"><span class="lab">${l}</span><input class="under" list="rlist" data-bind="meal" data-d="${d}" data-k="${k}" value="${esc(m[k])}" aria-label="${WD[i]} ${l}"></div>`);}
  const wkR=[...new Set([...Array(7)].flatMap((_,i)=>{const m=S.meals[iso(addDays(mon,i))]||{};return [m.b,m.l,m.d]}).filter(x=>findRecipe(x)))];
  h+=`</div>${wkR.length?`<div class="note"><span class="small"><b>📖 이번 주 메뉴 레시피</b></span><span class="chips">${wkR.map(n=>`<button class="chip" data-act="rv-open" data-v="${esc(n)}">${esc(n)}</button>`).join("")}</span></div>`:""}
  <div class="note"><span>메뉴를 위 목록에서 골라 넣으면, 장보기 탭에서 필요한 재료를 자동으로 뽑아줘요.</span><button class="btn sm pri" data-act="go-shop">이번 주 장보기 만들기</button></div>`;
  return h;
}
function urgentItems(){return S.fridge.filter(f=>f.status==="first"||f.status==="soon"||(f.date&&(parse(f.date)-parse(today()))/864e5<=2))}
function recommend(){const urg=urgentItems().map(f=>f.name);return allRecipes().map(r=>({r,hit:r.ing.split("\n").map(core).filter(c=>urg.some(u=>sameItem(u,c))).length})).filter(x=>x.hit>0).sort((a,b)=>b.hit-a.hit).slice(0,6)}
function rMonth(){
  const[y,m]=V.month.split("-").map(Number);const first=new Date(y,m-1,1);let d=monday(first);const t=today();
  const urg=urgentItems(),rec=recommend();
  let h=`<div class="month-top"><section class="box"><div class="cap c-pink">먼저 먹을 재료</div><div class="in">${urg.length?urg.map(f=>`<span class="tag ${f.status==="soon"?"hot":""}">${esc(f.name)}</span>`).join(""):`<div class="empty">냉장고 탭에서 '먼저 먹기'나 '기한임박'으로 표시하면 여기 모여요</div>`}</div></section>
  <section class="box"><div class="cap c-yellow">추천메뉴</div><div class="in">${rec.length?rec.map(x=>`<span class="tag">${esc(x.r.name)} <span class="muted small">재료 ${x.hit}개 활용</span></span>`).join(""):`<div class="empty">먼저 먹을 재료가 들어간 레시피가 여기 추천돼요</div>`}</div></section></div>
  <div class="cal">${WD.map((w,i)=>`<div class="h ${i===5?"sat":i===6?"sun":""}">${w}</div>`).join("")}`;
  for(let i=0;i<42;i++){const k=iso(d),me=S.meals[k]||{};const lines=[me.b,me.l,me.d].filter(Boolean);
    h+=`<button class="d ${d.getMonth()!==m-1?"out":""} ${k===t?"today":""}" data-act="cal-day" data-v="${k}"><span class="n">${d.getDate()}</span>${lines.slice(0,3).map(x=>`<span class="m">${esc(x)}</span>`).join("")}</button>`;
    d=addDays(d,1);if(i>=27&&d.getMonth()!==m-1&&(i+1)%7===0)break;}
  return h+`</div><p class="small muted" style="margin:0">날짜를 누르면 그 주의 주간식단으로 이동해요.</p>`;
}

/* 3. 장보기 */
function rShop(){
  V.shopView=V.shopView||"buy";const buy=S.shop.filter(x=>!x.paid),paid=S.shop.filter(x=>x.paid),checked=buy.filter(x=>x.done);
  const seg=`<div class="seg" style="width:100%;display:flex"><button style="flex:1" aria-pressed="${V.shopView==="buy"}" data-act="shv" data-v="buy">살 것 ${buy.length}</button><button style="flex:1" aria-pressed="${V.shopView==="done"}" data-act="shv" data-v="done">산 것 ${new Set(paid.map(x=>x.name)).size}</button></div>`;
  if(V.shopView==="done"){const g=new Map();paid.forEach(x=>{const k=x.paidAt?`${x.paidAt}|${x.store||""}|${x.amt||""}`:"|이전 기록|";(g.get(k)||g.set(k,[]).get(k)).push(x)});
    const groups=[...g.entries()].sort((a,b)=>b[0].localeCompare(a[0]));
    return `<div class="stack">${seg}
     <button class="btn rcbtn" data-act="co-open">＋ 영수증 없이 산 것 기록하기</button>
     ${groups.length?groups.map(([k,arr])=>{const[d,st,am]=k.split("|");const cnt=new Map();arr.forEach(x=>cnt.set(x.name,(cnt.get(x.name)||0)+1));
       return `<section class="box"><div class="in"><div class="small"><b>${d?`${+d.slice(5,7)}/${+d.slice(8)}`:""} ${esc(st)}</b>${am?` · <span class="num">${won(+am)}</span>`:""}</div><div class="chips" style="margin-top:6px">${[...cnt].map(([n,c])=>`<span class="tag">${esc(n)}${c>1?` ×${c}`:""}</span>`).join("")}</div></div></section>`}).join("")
      +(V.confirm==="shop-clear"?`<div class="row"><span class="small">산 것 기록을 모두 지울까요? (가계부·냉장고는 그대로예요)</span><button class="btn sm warn" data-act="shop-clear-yes">지우기</button><button class="btn sm" data-act="cancel">취소</button></div>`:`<button class="btn sm" data-act="shop-clear">지난 기록 정리</button>`)
      :`<div class="empty">아직 산 것 기록이 없어요. 영수증이나 계산하기로 기록하면 여기 모여요.</div>`}</div>`}
  const byCat=SHOP_CATS.map(c=>[c,buy.filter(x=>x.cat===c)]).filter(x=>x[1].length);
  return `<div class="stack">${seg}
  <form class="row" id="s-add"><input class="field" id="s-name" placeholder="살 것 · 쉼표로 여러 개 (예: 우유, 바나나)" style="flex:1;min-width:150px" autocomplete="off" required><button class="btn pri" type="submit">추가</button></form>
  <div class="row" style="gap:6px"><button class="btn sm" data-act="shop-gen">✨ 식단에서 채우기</button><span class="small muted">${weekNav()}</span></div>
  ${byCat.length?`<section class="box"><div class="in shoplist">${byCat.map(([c,arr])=>`<div class="shg">${c}</div>${arr.map(x=>`<div class="chk ${x.done?"done":""}"><input type="checkbox" id="sh-${x.id}" data-act="s-tog" data-id="${x.id}" ${x.done?"checked":""}><label for="sh-${x.id}">${esc(x.name)}${x.auto?`<span class="auto">식단</span>`:""}</label><button class="x" data-act="s-del" data-id="${x.id}" aria-label="삭제">×</button></div>`).join("")}`).join("")}</div></section>`
   :`<div class="empty">살 것이 없어요. 위에 적거나 '식단에서 채우기'를 눌러보세요.</div>`}
  ${checked.length?`<button class="cobar" data-act="co-open"><span>${checked.length}개 체크</span><b>계산하기 ›</b></button>`:`<button class="btn sm" data-act="co-open" style="justify-self:start">목록 없이 산 것 기록하기</button>`}
  </div>`;
}
function rCheckout(){if(!V.co)return "";return `<div class="overlay" data-act="co-bg"><div class="dlg" role="dialog" aria-modal="true"><div class="row spread"><h3>🧾 장보기 기록</h3><button class="x" data-act="co-close" aria-label="닫기">×</button></div>${checkout()}</div></div>`}

function checkout(){const done=S.shop.filter(s=>s.done&&!s.paid);const lastPay=(S.spend[S.spend.length-1]||{}).pay||"카드";

/* 4. 레시피 */
function stars(n,act){return `<span class="stars">${[1,2,3,4,5].map(i=>act?`<button type="button" class="${i<=n?"on":""}" data-act="r-star" data-v="${i}" aria-label="난이도 ${i}">★</button>`:`<span style="color:${i<=n?"#F0B92B":"var(--line)"}">★</span>`).join("")}</span>`}
function rRecipes(){
  const list=V.rcat==="기본"?STARTER:S.recipes.filter(r=>V.rcat==="전체"||r.cat===V.rcat).sort((a,b)=>a.no-b.no);

  <div class="rgrid"><section class="box"><div style="overflow-x:auto"><table class="rtable"><thead><tr><th>NO</th><th>메뉴명</th><th>분류</th><th>난이도</th></tr></thead><tbody>${list.length?list.map(r=>`<tr class="${r.id===V.rsel?"sel":""}" data-act="r-open" data-id="${r.id}"><td class="num">${r.starter?"기본":pad(r.no)}</td><td>${esc(r.name)}</td><td>${r.cat}</td><td>${stars(r.level)}</td></tr>`).join(""):`<tr><td colspan="4" class="empty">저장한 레시피가 없어요</td></tr>`}</tbody></table></div></section>
  <section>${V.redit?rEditor(sel):sel?rView(sel):`<div class="box"><div class="in empty">왼쪽에서 레시피를 고르거나 새로 추가하세요</div></div>`}</section></div></div>`;
}
function rView(r){
  const fr=S.fridge.map(f=>f.name);
  return `<div class="stack"><div class="rhead"><b style="font-family:var(--f-display);font-weight:400;font-size:1.15rem">${esc(r.name)}</b>${stars(r.level)}<span class="small muted">조리시간 ${esc(r.time)||"-"}</span></div>
  <div class="rev2"><section class="box"><div class="cap c-pink">준비 재료</div><div class="in">${r.ing.split("\n").filter(Boolean).map(l=>{const has=fr.some(f=>sameItem(f,core(l)));return `<div class="item"><span class="nm">${esc(l)}</span>${has?`<span class="have">냉장고에 있음</span>`:""}</div>`}).join("")||`<div class="empty">-</div>`}</div></section>
  <section class="box"><div class="cap c-pink">만드는 방법</div><div class="in" style="white-space:pre-wrap">${esc(r.steps)||"-"}</div></section></div>
  ${r.starter?`<div class="row"><span class="small muted">기본 레시피 · ${r.cat}</span><span style="flex:1"></span>${S.recipes.some(x=>x.name===r.name)?`<span class="small muted">✓ Best레시피에 담김</span>`:`<button class="btn pri" data-act="r-adopt">Best레시피에 담기</button>`}</div>`:`<div class="row"><span class="small muted">NO ${pad(r.no)} · ${r.cat}</span><span style="flex:1"></span><button class="btn" data-act="r-edit">수정</button>${V.confirm==="r-del"?`<span class="confirm">삭제할까요? <button class="btn sm warn" data-act="r-del-yes">삭제</button><button class="btn sm" data-act="cancel">취소</button></span>`:`<button class="btn warn" data-act="r-del">삭제</button>`}</div>`}</div>`;
}
function rEditor(r){
  const e=r||{cat:V.rcat==="전체"?"한식":V.rcat,name:"",level:2,time:"",ing:"",steps:""};

  <div class="rev2"><label class="box"><div class="cap c-pink">준비 재료 <span class="small">(한 줄에 하나)</span></div><div class="in"><textarea class="bare" id="r-ing" rows="8" placeholder="두부 반 모&#10;애호박 1/3개">${esc(e.ing)}</textarea></div></label>
  <label class="box"><div class="cap c-pink">만드는 방법</div><div class="in"><textarea class="bare" id="r-steps" rows="8">${esc(e.steps)}</textarea></div></label></div>

}

/* 5. 식비기록 */
function monthSpend(m){return S.spend.filter(s=>s.date.startsWith(m))}
function spendForm(compact){
  const e=compact?null:S.spend.find(s=>s.id===V.spendEdit);const cat=e?e.cat:V.spendCat;const lastPay=(S.spend[S.spend.length-1]||{}).pay||"카드";
  const chips=`<div class="chips">${SPEND_CATS.map(c=>`<button type="button" class="chip" aria-pressed="${c===cat}" data-act="sp-cat" data-v="${c}">${c}</button>`).join("")}</div>`;
  const pay=`<select class="field" id="sp-pay" aria-label="결제수단">${PAYS.map(p=>`<option ${(e?e.pay:lastPay)===p?"selected":""}>${p}</option>`).join("")}</select>`;
  if(compact)return `${quickChips()}<button type="button" class="btn rcbtn" data-act="rc-open">🧾 영수증으로 입력하기</button><form class="qform" id="sp-form"><input type="hidden" id="sp-date" value="${today()}"><input type="hidden" id="sp-memo" value="">
    <input class="field" id="sp-desc" placeholder="내용 (예: 마트)" autocomplete="off" required><input class="field num" id="sp-amt" inputmode="numeric" placeholder="금액" required><button class="btn pri" type="submit">기록</button>
    <div class="row wide" style="gap:8px">${chips}${pay}</div>${itemsRow(cat)}</form>`;
  return `<form class="sform box" style="padding:12px" id="sp-form">
    <input class="field" type="date" id="sp-date" value="${e?e.date:(V.month===ym(new Date())?today():V.month+"-01")}" required aria-label="날짜">
    <input class="field" id="sp-desc" placeholder="내용 (예: 마트 장보기)" value="${esc(e?.desc)}" required autocomplete="off">
    <div class="wide">${chips}</div>
    ${pay}
    <input class="field num" id="sp-amt" inputmode="numeric" placeholder="금액" value="${e?e.amount.toLocaleString("ko-KR"):""}" required>
    <input class="field" id="sp-memo" placeholder="비고" value="${esc(e?.memo)}">
    ${e?"":itemsRow(cat)}
    <div class="row">${e?`<button class="btn pri" type="submit">수정 저장</button><button class="btn" type="button" data-act="sp-cancel">취소</button>`:`<button class="btn pri" type="submit">기록</button>`}</div>
  </form>`;
}
function itemsRow(cat){return `<div class="wide items-row" id="sp-items-row" ${cat==="장보기"?"":"hidden"}><input class="field" id="sp-items" placeholder="산 것 (선택) 예: 두부, 대파 → 냉장고에 들어가요" autocomplete="off" style="width:100%"></div>`}
/* 산 것 → 장보기 목록에서 찾아 체크(없으면 '산 것'으로 추가) + 냉장고로 */
function boughtItems(names,meta){meta=meta||{};let moved=0,ticked=0,added=0;names.forEach(n=>{
    const hit=S.shop.find(s=>!s.paid&&sameItem(s.name,n));let cat;
    const pm={paidAt:meta.date||today(),store:meta.store||"",amt:meta.amt||""};if(hit){Object.assign(hit,{done:true,paid:true},pm);cat=hit.cat;ticked++}else{cat=guessCat(n);S.shop.push({id:uid(),name:n,cat,done:true,paid:true,extra:true,...pm});added++}
    if(cat!=="생활용품"){addFridge(n,fridgeZone(cat,n));moved++}});return{moved,ticked,added}}
function frequent(){const m=new Map();S.spend.forEach(s=>{if(!s.desc)return;const k=s.desc+"|"+s.cat;const o=m.get(k)||{desc:s.desc,cat:s.cat,pay:s.pay,amount:s.amount,n:0,last:""};o.n++;if(s.date>=o.last){o.last=s.date;o.amount=s.amount;o.pay=s.pay}m.set(k,o)});
  return [...m.values()].sort((a,b)=>b.n-a.n||b.last.localeCompare(a.last)).slice(0,6)}
function quickChips(){V.freq=frequent();return `<div class="qhead"><b>⚡ 빠른 지출</b><span class="small muted">${V.freq.length?"자주 쓰는 곳을 누르면 내용·금액이 채워져요":"기록이 쌓이면 자주 쓰는 곳이 여기 버튼으로 생겨요"}</span></div>`+(V.freq.length?`<div class="qchips">${V.freq.map((x,i)=>`<button type="button" class="chip" data-act="q-fill" data-v="${i}">${esc(x.desc)} <span class="muted small num">${won(x.amount)}</span></button>`).join("")}</div>`:"")}
function rSpend(){
  const list=monthSpend(V.month).sort((a,b)=>b.date.localeCompare(a.date));
  const e=S.spend.find(s=>s.id===V.spendEdit);const cat=e?e.cat:V.spendCat;
  const tot=list.reduce((a,s)=>a+s.amount,0);
  return `<div class="stack"><div class="row" style="justify-content:flex-end"><div class="total"><b>TOTAL</b><span class="num">${won(tot)}</span></div></div>
  ${quickChips()}${spendForm(false)}
  <section class="box slist"><div class="srow head"><span>날짜</span><span>내용</span><span>카테고리</span><span>결제</span><span class="amt">금액</span><span>비고</span><span></span></div>
  ${list.length?list.map(s=>{const d=parse(s.date);return `<div class="srow ${s.id===V.spendEdit?"edit":""}" data-act="sp-open" data-id="${s.id}"><span class="num muted">${d.getMonth()+1}/${d.getDate()}</span><span>${esc(s.desc)}</span><span><span class="pill p-${s.cat}">${s.cat}</span></span><span class="small muted">${s.pay}</span><span class="amt num">${won(s.amount)}</span><span class="small muted">${esc(s.memo)}</span><button class="x" data-act="sp-del" data-id="${s.id}" aria-label="삭제">×</button></div>`}).join(""):`<div class="empty">이 달의 기록이 없어요</div>`}</section>
  <p class="small muted" style="margin:0">줄을 누르면 수정할 수 있어요. 여기 적은 내용이 월결산에 자동으로 합산돼요.</p></div>`;
}

/* 6. 결산 */
function rMoney(){
  return `<div class="stack"><div class="row spread"><div class="seg">${[["list","기록"],["month","월결산"],["review","식단회고"]].map(([k,l])=>`<button aria-pressed="${V.rep===k}" data-act="rep" data-v="${k}">${l}</button>`).join("")}</div>${V.rep==="review"?weekNav():monthNav()}</div>
  ${V.rep==="month"?`<div class="months">${Array.from({length:12},(_,i)=>`<button class="mo num" aria-pressed="${+V.month.slice(5)===i+1}" data-act="mo" data-v="${i+1}">${pad(i+1)}</button>`).join("")}</div>`:""}
  ${V.rep==="list"?rSpend():V.rep==="month"?rMonthly():V.rep==="review"?rReview():rHabit()}</div>`;
}
function catSums(m){const o=Object.fromEntries(SPEND_CATS.map(c=>[c,0]));monthSpend(m).forEach(s=>o[s.cat]+=s.amount);return o}
function rMonthly(){
  const m=V.month,sums=catSums(m),used=Object.values(sums).reduce((a,b)=>a+b,0),bud=S.budget[m]||0,left=bud-used;
  const[y,mo]=m.split("-").map(Number);const prev=ym(new Date(y,mo-2,1));const pu=Object.values(catSums(prev)).reduce((a,b)=>a+b,0);
  const pos=Object.entries(sums).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);const max=Math.max(1,...Object.values(sums));
  const mm=S.monthly[m]||{};const inp=(k,ph)=>`<input data-bind="mon" data-k="${k}" value="${esc(mm[k])}" placeholder="${ph}">`;
  return `<div class="kpis"><div class="kpi"><div class="l">예산</div><input class="num" inputmode="numeric" data-bind="budget" value="${bud?bud.toLocaleString("ko-KR"):""}" placeholder="금액 입력" aria-label="이번 달 예산"></div>
  <div class="kpi"><div class="l">사용 금액</div><div class="v num">${won(used)}</div><div class="small muted">${pu?`지난 달보다 ${used>=pu?"+":"-"}${won(Math.abs(used-pu))}`:"지난 달 기록 없음"}</div></div>
  <div class="kpi"><div class="l">남은 금액</div><div class="v num ${left<0?"neg":""}">${bud?won(left):"-"}</div><div class="small muted">${bud?`예산의 ${Math.round(used/bud*100)}% 사용`:"예산을 입력하면 계산돼요"}</div></div></div>
  <p style="margin:0;color:var(--brown)" class="small">이번 달 기록이 다음 달 식비를 바꿔줍니다.</p>
  <div class="cols3b"><section class="box"><div class="cap c-sky">카테고리</div><div class="in">${SPEND_CATS.map(c=>`<div class="catline"><b>${c}</b><div class="bar"><i style="width:${sums[c]/max*100}%;background:var(--${SPEND_C[c]==="sunk"?"muted":SPEND_C[c]})"></i></div><span class="num">${won(sums[c])}</span></div>`).join("")}<div class="sumline"><span>합계</span><span class="num">${won(used)}</span></div></div></section>
  <section class="box"><div class="cap c-lime">이번 달 식비 돌아보기</div><div class="in"><div class="q"><span>가장 많이 쓴 곳</span><div class="auto-v">${pos[0]?`${pos[0][0]} · ${won(pos[0][1])}`:"-"}</div></div><div class="q"><span>가장 적게 쓴 곳</span><div class="auto-v">${pos.length>1?`${pos[pos.length-1][0]} · ${won(pos[pos.length-1][1])}`:"-"}</div></div><div class="q"><span>다음 달 줄여볼 소비</span>${inp("cut","예: 배달 2회 줄이기")}</div></div></section>
  <section class="box"><div class="cap c-lime">소비 습관 체크</div><div class="in"><div class="q"><span>이번 달 잘한 점</span>${inp("good","")}</div><div class="q"><span>아쉬웠던 소비</span>${inp("bad","")}</div><div class="q"><span>다음 달 이어갈 한 가지</span>${inp("keep","")}</div></div></section></div>
  <div class="box"><div class="in row"><b style="white-space:nowrap">♡ 이번 달 한 줄 메모</b><input class="under" style="flex:1;min-width:160px" data-bind="mon" data-k="memo" value="${esc(mm.memo)}"></div></div>`;
}
function rReview(){
  const mon=parse(V.week),days=[...Array(7)].map((_,i)=>iso(addDays(mon,i)));
  const ws=S.spend.filter(s=>days.includes(s.date));const c=k=>ws.filter(s=>s.cat===k).length;
  const t=today();const passed=days.filter(d=>d<=t);const zero=passed.filter(d=>!ws.some(s=>s.date===d)).length;
  const rv=S.review[V.week]||{};const ta=(k,l,cl)=>`<label class="box"><div class="cap c-${cl}">${l}</div><div class="in"><textarea class="bare" data-bind="rev" data-k="${k}">${esc(rv[k])}</textarea></div></label>`;
  return `<div class="rev3">${ta("good","만족한 식단","yellow")}${ta("bad","아쉬운 식단","yellow")}${ta("again","다시 먹고 싶은 메뉴","yellow")}</div>
  <div class="rev2">${ta("next","다음 주 식단 아이디어","yellow")}${ta("rebuy","재구매 식재료","lime")}</div>
  <section class="box"><div class="cap c-sky">이번 주 소비 한눈에 보기 <span class="small">· 식비기록에서 자동 집계</span></div><div class="in counts num">
  <div><span class="small">배달</span><b>${c("배달")}</b><span class="small muted">회</span></div><div><span class="small">장보기</span><b>${c("장보기")}</b><span class="small muted">회</span></div><div><span class="small">외식</span><b>${c("외식")}</b><span class="small muted">회</span></div><div><span class="small">무지출 날</span><b>${zero}</b><span class="small muted">일</span></div><div><span class="small">이번 주 합계</span><b style="font-size:1.1rem;padding-top:6px">${won(ws.reduce((a,s)=>a+s.amount,0))}</b></div></div></section>`;
}
function rHabit(){
  const m=V.month,[y,mo]=m.split("-").map(Number),n=new Date(y,mo,0).getDate();const hm=S.habits[m]||{};
  const wk=d=>{const g=new Date(y,mo-1,d).getDay();return g===0||g===6};
  return `<div class="hgrid-wrap"><table class="hgrid num"><thead><tr><th class="hn">식비절약습관</th>${[...Array(n)].map((_,i)=>`<th>${i+1}</th>`).join("")}<th>합계</th></tr></thead><tbody>${HABITS.map(h=>{const on=hm[h]||[];return `<tr><td class="hn">${h}</td>${[...Array(n)].map((_,i)=>`<td class="${wk(i+1)?"wk":""}"><button class="hc ${on.includes(i+1)?"on":""}" data-act="h-tog" data-h="${h}" data-v="${i+1}" aria-label="${h} ${i+1}일" aria-pressed="${on.includes(i+1)}"></button></td>`).join("")}<td class="cnt">${on.length}</td></tr>`}).join("")}</tbody></table></div>
  <p class="small muted" style="margin:0">칸을 눌러 실천한 날을 체크하세요. 옆으로 밀면 31일까지 보여요.</p>`;
}


/* ---------- 굿노트로 내보내기 (원본 서식 PDF 위에 채우기) ---------- */

const LIB_H2C="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";

/* 원본 서식(100쪽) 페이지 번호 — 0부터 */

/* ---------- 월별 노트: 다른 달 페이지 빼고 링크 다시 잇기 ---------- */
const MONTHLY=[["month",8],["habit",61],["settle",88]];  /* 달마다 1장씩 있는 페이지 (시작 위치, 0부터) */
function monthOfPage(i){for(const[t,b]of MONTHLY)if(i>=b&&i<b+12)return[t,i-b];return null}
async function buildMonthDoc(doc,mo){
  const L=window.PDFLib,{PDFName,PDFArray,PDFDict,PDFNumber,PDFRef}=L,ctx=doc.context,N=doc.getPageCount();
  const refIdx=new Map(doc.getPages().map((p,i)=>[p.ref.toString(),i]));
  /* 이름으로 된 목적지 찾기 */
  const cat=doc.catalog,named=new Map();
  const addTree=node=>{node=ctx.lookup(node);if(!(node instanceof PDFDict))return;const nm=node.lookup(PDFName.of("Names"));if(nm instanceof PDFArray)for(let i=0;i+1<nm.size();i+=2)named.set(String(nm.lookup(i).decodeText?nm.lookup(i).decodeText():nm.lookup(i).asString?nm.lookup(i).asString():nm.lookup(i)),nm.get(i+1));
    const kids=node.lookup(PDFName.of("Kids"));if(kids instanceof PDFArray)for(let i=0;i<kids.size();i++)addTree(kids.get(i))};
  try{const nms=cat.lookup(PDFName.of("Names"));if(nms instanceof PDFDict){const d=nms.get(PDFName.of("Dests"));if(d)addTree(d)}}catch(e){}
  try{const old=cat.lookup(PDFName.of("Dests"));if(old instanceof PDFDict)old.entries().forEach(([k,v])=>named.set(k.decodeText?k.decodeText():String(k).replace(/^\//,""),v))}catch(e){}
  const destIndex=D=>{D=ctx.lookup(D);if(D instanceof PDFDict)D=ctx.lookup(D.get(PDFName.of("D")));
    if(D instanceof PDFArray){const f=D.get(0);if(f instanceof PDFRef){const i=refIdx.get(f.toString());return i==null?null:[i,D]}if(f instanceof PDFNumber)return[f.asNumber(),D];return null}
    if(D){const key=D.decodeText?D.decodeText():String(D).replace(/^\//,"");const v=named.get(key);return v?destIndex(v):null}return null};
  /* 1) 원본에서 링크 목적지를 '쪽 번호'로 바꿔두기 (다른 쪽을 끌고 오지 않게) */
  for(let i=0;i<N;i++){const an=doc.getPage(i).node.Annots();if(!an)continue;
    for(let j=0;j<an.size();j++){const a=ctx.lookup(an.get(j));if(!(a instanceof PDFDict))continue;
      let D=a.get(PDFName.of("Dest")),A=a.lookup(PDFName.of("A"));if(!D&&A instanceof PDFDict&&String(A.get(PDFName.of("S")))==="/GoTo")D=A.get(PDFName.of("D"));if(!D)continue;
      const r=destIndex(D);if(!r)continue;const arr=PDFArray.withContext(ctx);arr.push(PDFNumber.of(r[0]));const src=r[1];for(let k=1;k<src.size();k++)arr.push(src.get(k));if(src.size()<2)arr.push(PDFName.of("Fit"));
      a.set(PDFName.of("Dest"),arr);a.delete(PDFName.of("A"))}}
  /* 2) 남길 쪽: 다른 달 전용 페이지만 빼기 */
  const keep=[];for(let i=0;i<N;i++){const t=monthOfPage(i);if(!t||t[1]===mo-1)keep.push(i)}
  const out=await L.PDFDocument.create();const cp=await out.copyPages(doc,keep);cp.forEach(p=>out.addPage(p));
  const newIdx=new Map(keep.map((o,n)=>[o,n]));const remap=t=>{if(newIdx.has(t))return newIdx.get(t);const mp=monthOfPage(t);if(mp){const b=MONTHLY.find(x=>x[0]===mp[0])[1];return newIdx.get(b+mo-1)}return null};
  /* 3) 새 문서에서 쪽 번호를 실제 페이지로 다시 잇기 */
  const op=out.getPages(),octx=out.context;let fixed=0,dropped=0;
  op.forEach(pg=>{const an=pg.node.Annots();if(!an)return;const keepA=PDFArray.withContext(octx);
    for(let j=0;j<an.size();j++){const a=octx.lookup(an.get(j));const D=a instanceof PDFDict?a.get(PDFName.of("Dest")):null;
      if(D instanceof PDFArray&&D.get(0) instanceof PDFNumber){const nt=remap(D.get(0).asNumber());if(nt==null){dropped++;continue}D.set(0,op[nt].ref);fixed++}
      keepA.push(an.get(j))}
    pg.node.set(PDFName.of("Annots"),keepA)});
  return{out,count:keep.length,fixed,dropped};
}
async function saveBlob(blob,fname){const dl=(window.claude&&typeof window.claude.use==="function")?await window.claude.use("downloads").catch(()=>null):null;
  if(dl){await dl.save({filename:fname,data:blob});return}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}

async function exportPDF(){
  if(!V.tpl){exStat("먼저 식단플래너 PDF를 연결하세요");return}
  const {pages,over}=buildOverlays();if(!pages.length){exStat("채울 페이지를 하나 이상 고르세요");return}
  V.exBusy=true;renderAll();exStat("준비 중…");const host=$("#print");
  try{
    await loadScript(LIB_H2C);await loadScript(LIB_PDFLIB);
    try{await document.fonts.load('20px "Jua"');await document.fonts.load('17px "Gowun Dodum"');await document.fonts.ready}catch(e){}
    const doc=await window.PDFLib.PDFDocument.load(V.tpl.buf.slice(0),{ignoreEncryption:true});
    for(let i=0;i<pages.length;i++){const[pi,html]=pages[i];if(!html)continue;
      exStat(`${i+1} / ${pages.length} 페이지 채우는 중`);
      host.innerHTML=`<div class="ovp">${html}</div>`;
      const cv=await window.html2canvas(host.firstElementChild,{scale:2,backgroundColor:null,logging:false});
      const png=await new Promise(r=>cv.toBlob(b=>r(b),"image/png")).then(b=>b.arrayBuffer());
      const img=await doc.embedPng(png);const pg=doc.getPage(pi);const{width,height}=pg.getSize();pg.drawImage(img,{x:0,y:0,width,height});
    }
    host.innerHTML="";exStat("PDF 저장 준비 중…");
    let out=doc,fname;const[y,m]=V.month.split("-");
    if(V.exMode==="pick"){const L=window.PDFLib;out=await L.PDFDocument.create();const idx=[...new Set(pages.map(x=>x[0]))];
      const cp=await out.copyPages(doc,idx);cp.forEach(pg=>{try{pg.node.delete(L.PDFName.of("Annots"))}catch(e){}out.addPage(pg)});
      const mon=parse(V.week);fname=`식단플래너_${V.exScope==="week"?`${mon.getMonth()+1}월${mon.getDate()}일주`:`${y}년${+m}월`}_${idx.length}쪽.pdf`}
    else if(V.exMode==="month"){exStat("다른 달 페이지 빼고 링크 잇는 중…");const r=await buildMonthDoc(doc,+m);out=r.out;V.exMonthPages=r.count;fname=`식비절약식단플래너_${y}년${+m}월_월별노트.pdf`}
    else fname=`식비절약식단플래너_${y}년_1년전체노트.pdf`;
    const bytes=await out.save();const blob=new Blob([bytes],{type:"application/pdf"});const nPages=V.exMode==="pick"?new Set(pages.map(x=>x[0])).size:V.exMode==="month"?V.exMonthPages:pages.length;
    try{await saveBlob(blob,fname);S.meta.planner=true;save("meta");exStat(V.exMode==="month"?`${+m}월 노트 ${nPages}쪽을 저장했어요. 탭 링크는 ${+m}월 페이지로 이어져요`:(V.exMode==="pick"?`${nPages}쪽 PDF를 저장했어요. 굿노트·삼성노트에서 기존 노트에 '페이지 추가 → 가져오기'로 넣으세요`:`1년 전체 노트(${doc.getPageCount()}쪽)를 저장했어요 · 기록을 채운 페이지 ${nPages}쪽`)+(over.length?` · 칸이 모자라 빠진 것: ${over.join(", ")}`:""))}
    catch(err){exStat(err&&err.code==="declined"?"저장을 취소했어요":"저장하지 못했어요. 잠시 후 다시 시도해주세요")}
  }catch(e){host.innerHTML="";exStat("PDF를 만들지 못했어요. 인터넷 연결을 확인하고 다시 시도해주세요")}
  V.exBusy=false;renderAll();
}

const RC_SKIP=/합\s*계|총\s*액|총\s*금액|결제|받을|받은|거스름|부가세|부\s*가|과세|면세|할인|쿠폰|포인트|적립|승인|카드|현금|사업자|대표|주소|전화|TEL|tel|영수증|일시|단가|수량|금액|상품명|품명|POS|pos|번호|가맹|매출|합산|봉투|소계|교환|환불|감사|회원|잔액|공급가|VAT|vat/;
const RC_TOTAL=[/받을\s*금액|결제\s*금액|총\s*결제|승인\s*금액|청구\s*금액/,/합\s*계|총\s*액|총\s*금액|총\s*구매|판매\s*금액|총\s*합계/];

function parseReceipt(text){
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);const r={store:"",date:today(),total:0,pay:"카드",items:[]};
  const dm=text.match(/(20\d{2})\s*[.\-\/년]\s*(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})/);if(dm){const d=new Date(+dm[1],+dm[2]-1,+dm[3]);if(!isNaN(d)&&d<=new Date())r.date=iso(d)}
  if(/현금/.test(text)&&!/카드|신용|체크/.test(text))r.pay="현금";

    const data={date:$("#sp-date").value||today(),desc:$("#sp-desc").value.trim()||V.spendCat,cat:V.spendCat,pay:$("#sp-pay").value,amount,memo:$("#sp-memo").value.trim()};
    const ex=S.spend.find(s=>s.id===V.spendEdit);if(ex){Object.assign(ex,data);V.spendEdit=null;toast("수정했어요")}else{
      const items=data.cat==="장보기"&&$("#sp-items")?splitNames($("#sp-items").value):[];let msg=`${data.cat} ${won(amount)} 기록`;
      if(items.length){if(!data.memo)data.memo=items.join(", ");const r=boughtItems(items,{date:data.date,store:data.desc,amt:data.amount});save("fridge","shop");msg+=` · 냉장고 ${r.moved}개`+(r.ticked?` · 장보기 목록 ${r.ticked}개 체크`:"")}
      S.spend.push({id:uid(),...data});toast(msg)}
    if(!data.date.startsWith(V.month))V.month=data.date.slice(0,7);save("spend");renderAll();if(V.tab!=="today")$("#sp-desc").focus()}
}
document.addEventListener("keydown",e=>{if(e.target.id==="sp-amt"||e.target.id==="co-amt")setTimeout(()=>{const t=e.target,n=t.value.replace(/[^\d]/g,"");t.value=n?(+n).toLocaleString("ko-KR"):""},0)});

/* ---------- boot ---------- */
const local=loadLocal();
if(local)S=Object.assign(blank(),local);else{S=blank();S.meta.onboard=true}
V.tab="today";try{history.replaceState(null,"","#today")}catch(e){}
window.addEventListener("hashchange",()=>{let h=location.hash.slice(1);h=TAB_ALIAS[h]||h;if(h&&h!==V.tab&&TABS.some(x=>x[0]===h)){V.tab=h;renderAll()}});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if(S.meta.onboard){V.ob=S.meta.obStep||0;V.obMax=V.ob}
dedupeFridge();
$("#rs-chips").innerHTML=RESETS.map(([k,l])=>`<label class="chip rschip"><input type="checkbox" data-rs="${k}"> ${l}</label>`).join("");
renderAll();
setStore(false);
connectDB();
</script>

<script>
/* ---------- 구매 확인 (판매판에서만 동작) ---------- */
(function(){
const ON=window.AMPM_SALE===true||/[?&]sale=1/.test(location.search);if(!ON)return;
const URL_=window.AMPM_LICENSE_URL||"https://script.google.com/macros/s/AKfycbzSjSGSihjjCkr9ilojBWMf_DxY9gGKHAtXGGxN1YyGU7Yn6b9-4iJPasjFjLl6f5sPcA/exec";
const KEY="ampm-license",DKEY="ampm-device-id",GRACE=3*864e5;
const ls={get(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let dev=ls.get(DKEY);if(!dev){dev=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));ls.set(DKEY,dev)}
const ua=navigator.userAgent,devName=/iPad|Macintosh.*Mobile|Macintosh(?=.*Safari)(?!.*Chrome)/.test(ua)&&navigator.maxTouchPoints>1?"아이패드":/iPhone/.test(ua)?"아이폰":/Android/.test(ua)?(/Mobile/.test(ua)?"안드로이드 폰":"안드로이드 태블릿"):/Mac/.test(ua)?"맥":/Windows/.test(ua)?"윈도우 PC":"기타";
async function call(q){const u=URL_+"?"+new URLSearchParams(q).toString();const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),12000);
  try{const r=await fetch(u,{signal:ctl.signal,redirect:"follow"});return await r.json()}finally{clearTimeout(t)}}
const MSG={not_found:"주문번호를 찾을 수 없어요. 구매 직후라면 확인까지 몇 시간 걸릴 수 있어요.",phone_mismatch:"휴대폰 뒷자리 4개가 주문 정보와 달라요.",blocked:"사용이 중지된 주문번호예요. 판매자에게 문의해 주세요.",bad_request:"주문번호를 다시 확인해 주세요.",kicked:"같은 주문번호로 다른 기기 2대가 사용 중이라 이 기기가 로그아웃됐어요."};
const g=document.createElement("div");g.id="gate";document.body.appendChild(g);
const st=document.createElement("style");st.textContent=`#gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px}#gate.on{display:flex}
#gate .gbox{max-width:420px;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:12px}
#gate h2{margin:0;font-size:20px}#gate p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}#gate .gerr{color:#c0392b;font-size:14px;min-height:1.2em}#gate label{font-size:13px;font-weight:600}`;document.head.appendChild(st);
function show(mode,msg,pre){const L=ls.get(KEY)||{};g.classList.add("on");
  if(mode==="offline"){g.innerHTML=`<div class="gbox"><h2>📶 인터넷 연결이 필요해요</h2><p>3일 넘게 구매 확인을 못 했어요. 인터넷에 연결한 뒤 다시 열어주세요. 기록은 그대로 있어요.</p><button class="btn pri big" id="g-retry">다시 확인하기</button><div class="gerr" id="g-err"></div></div>`;
    g.querySelector("#g-retry").onclick=()=>check(true);return}
  g.innerHTML=`<div class="gbox"><h2>🍽 식단 플래너 시작하기</h2><p>${msg?"":"스마트스토어에서 구매한 <b>주문번호</b>와 주문할 때 쓴 <b>휴대폰 번호 뒷자리 4개</b>를 넣어주세요. 한 주문번호로 기기 2대까지 함께 쓸 수 있어요."}</p>
   <label for="g-order">주문번호</label><input class="field" id="g-order" inputmode="numeric" autocomplete="off" placeholder="예: 2026112912345678" value="${(pre||L.order||"").replace(/\D/g,"")}">
   <label for="g-phone">휴대폰 뒷자리 4개</label><input class="field" id="g-phone" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="1234">
   <button class="btn pri big" id="g-go">시작하기</button><div class="gerr" id="g-err">${msg||""}</div>
   <p style="font-size:12px">주문번호는 네이버 > 쇼핑 > 주문내역에서 볼 수 있어요. 내 기록은 이 기기에만 저장되고 판매자에게 보내지지 않아요.</p></div>`;
  const go=async()=>{const o=g.querySelector("#g-order").value.replace(/\D/g,""),ph=g.querySelector("#g-phone").value.replace(/\D/g,""),er=g.querySelector("#g-err"),bt=g.querySelector("#g-go");
    if(o.length<8){er.textContent="주문번호를 확인해 주세요.";return}if(ph.length!==4){er.textContent="휴대폰 뒷자리 4개를 넣어주세요.";return}
    bt.disabled=true;bt.textContent="확인 중…";er.textContent="";
    try{const r=await call({action:"activate",order:o,phone:ph,device:dev,name:devName});
      if(r&&r.ok){ls.set(KEY,{order:o,lastOk:Date.now()});g.classList.remove("on");g.innerHTML="";if(typeof toast==="function")toast(r.kicked?"확인됐어요 · 가장 오래 안 쓴 기기 1대는 로그아웃됐어요":"구매 확인이 끝났어요. 반가워요!")}
      else er.textContent=MSG[r&&r.code]||"확인하지 못했어요. 잠시 후 다시 해주세요."}
    catch(e){er.textContent="인터넷 연결을 확인하고 다시 눌러주세요."}
    bt.disabled=false;bt.textContent="시작하기"};
  g.querySelector("#g-go").onclick=go;g.querySelector("#g-phone").onkeydown=e=>{if(e.key==="Enter")go()};}
async function check(manual){const L=ls.get(KEY);if(!L||!L.order){show("enter");return}
  try{const r=await call({action:"check",order:L.order,device:dev});
    if(r&&r.ok){L.lastOk=Date.now();ls.set(KEY,L);g.classList.remove("on");g.innerHTML="";return}
    if(r&&(r.code==="kicked"||r.code==="blocked"||r.code==="not_found")){ls.set(KEY,{order:L.order});show("enter",MSG[r.code],L.order);return}
    throw new Error("bad")}
  catch(e){if(!L.lastOk||Date.now()-L.lastOk>GRACE){show("offline");if(manual){const er=g.querySelector("#g-err");if(er)er.textContent="아직 연결되지 않았어요."}}}}
window.AMPM_LICENSE={check,reset(){localStorage.removeItem(KEY)},device:dev};
const L0=ls.get(KEY);if(!L0||!L0.order)show("enter");else check(false);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){const L=ls.get(KEY);if(L&&L.order&&Date.now()-(L.lastOk||0)>6*3600e3)check(false)}});
})();
</script>
