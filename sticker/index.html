<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>칭찬스티커판</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 상단 알약 탭 + 720px 단일 컬럼. 파스텔 컬러 카드(연두·하늘·버터·핑크)로 영역을 구분. */
:root{
  --bg:#F3F8EC; --bg2:#E3F1D3; --surface:#FFFFFF; --sunk:#F1F6EA; --line:#E1EAD5;
  --ink:#24321D; --muted:#6D7B64; --accent:#6DBB5A; --accent-ink:#FFFFFF; --accent-soft:#DDF0CF;
  --sky:#D3EDF9; --sky-ink:#2A7CA5; --butter:#FFF2BF; --butter-ink:#94700C; --pink:#FDE0E6; --pink-ink:#C0425D; --lav:#E9E3FB; --lav-ink:#5B4BB7;
  --gold:#F6C744; --mint:#5DB8E5; --coral:#F2849B;
  --ok:#3E9E4F; --warn:#C98A12; --bad:#D2455A;
  --shadow:0 4px 18px rgba(70,110,40,.08);
  --display:"Jua","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131911; --bg2:#1B2617; --surface:#1E271A; --sunk:#253020; --line:#33412D;
  --ink:#EAF2E2; --muted:#A3B29A; --accent:#8FD47B; --accent-ink:#13200E; --accent-soft:#2B3F24;
  --sky:#1D3846; --sky-ink:#9AD6F2; --butter:#3B3317; --butter-ink:#F3D673; --pink:#43232B; --pink-ink:#F6A9B9; --lav:#2E2846; --lav-ink:#C3B8F5;
  --gold:#F6C744; --mint:#6CC4EC; --coral:#F58FA5;
  --ok:#6FCF7E; --warn:#E8B44A; --bad:#F06B7F; --shadow:0 4px 18px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131911; --bg2:#1B2617; --surface:#1E271A; --sunk:#253020; --line:#33412D;
  --ink:#EAF2E2; --muted:#A3B29A; --accent:#8FD47B; --accent-ink:#13200E; --accent-soft:#2B3F24;
  --sky:#1D3846; --sky-ink:#9AD6F2; --butter:#3B3317; --butter-ink:#F3D673; --pink:#43232B; --pink-ink:#F6A9B9; --lav:#2E2846; --lav-ink:#C3B8F5;
  --gold:#F6C744; --mint:#6CC4EC; --coral:#F58FA5;
  --ok:#6FCF7E; --warn:#E8B44A; --bad:#F06B7F; --shadow:0 4px 18px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg) linear-gradient(180deg,var(--bg2) 0,var(--bg) 360px) no-repeat;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;margin:0;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg2)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 48px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:23px} h3{font-size:18px}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* top */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg2) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.top-in{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:10px}
.brand h1{font-size:23px;display:flex;align-items:center;gap:8px}
.brand h1 svg{width:30px;height:30px;padding:5px;background:var(--surface);border-radius:50%;box-shadow:var(--shadow)}
.who{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:10px;text-align:right;flex-wrap:wrap;justify-content:flex-end}
.linkbtn{background:none;border:0;color:var(--accent);padding:4px 0;font-size:13px;font-weight:700}
:root:not([data-theme="dark"]) .linkbtn{color:color-mix(in srgb,var(--accent) 70%,var(--ink))}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;background:var(--surface);border-radius:999px;padding:5px;box-shadow:var(--shadow)}
.tabs:empty{display:none}
.tab{flex:1 0 auto;background:none;border:0;padding:9px 14px;font-weight:700;color:var(--muted);border-radius:999px;font-size:15px}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.demo{background:var(--butter);color:var(--butter-ink);font-size:13px;font-weight:700;text-align:center;padding:6px 16px}

/* generic */
.card{background:var(--surface);border:0;border-radius:24px;padding:20px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.field{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
input[type=text],input[type=password],input[type=date],input[type=number],textarea,select{background:var(--sunk);border:1.5px solid transparent;border-radius:14px;padding:12px 14px;width:100%;min-width:0}
input:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none;background:var(--surface)}
textarea{resize:vertical;min-height:64px}
.btn{border:0;background:var(--sunk);border-radius:14px;padding:11px 18px;font-weight:700}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.danger{color:var(--pink-ink);background:var(--pink)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:4px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 16px;border-radius:999px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:var(--ok)}
.pill.warn{background:var(--butter);color:var(--butter-ink)}
.pill.bad{background:var(--pink);color:var(--pink-ink)}
.notice{border-radius:14px;padding:12px 14px;background:var(--sunk);font-size:14px}
.notice.bad{background:var(--pink);color:var(--pink-ink)}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:999px;font-weight:700;z-index:40;font-size:14px;max-width:calc(100% - 32px);text-align:center}

/* login */
.tlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.tbtn{border:0;background:var(--sunk);border-radius:16px;padding:15px 10px;font-weight:700;text-align:center}
.tbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pin{letter-spacing:.5em;text-align:center;font-size:22px;font-variant-numeric:tabular-nums}

/* member chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
.chip{flex:0 0 auto;border:0;background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:700;display:flex;gap:8px;align-items:center;box-shadow:var(--shadow)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chip .c{font-size:12px;padding:1px 7px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.chip[aria-pressed="true"] .c{background:color-mix(in srgb,var(--accent-ink) 25%,transparent);color:inherit}

/* board */
.board{background:linear-gradient(165deg,var(--accent-soft) 0,var(--surface) 46%);border-radius:28px;padding:20px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.board-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.board-head h2{font-size:27px}
.ring{--p:0;width:86px;height:86px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p) * 1%),color-mix(in srgb,var(--accent) 18%,var(--surface)) 0)}
.ring span{width:68px;height:68px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ring b{font-family:var(--display);font-weight:400;font-size:26px}
.ring small{font-size:12px;color:var(--muted);font-weight:700;margin-top:2px}
.count{font-family:var(--display);font-size:30px;line-height:1}
.count small{font-size:16px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}
.grid.g50{grid-template-columns:repeat(10,1fr)}
@media (max-width:520px){.grid.g50{grid-template-columns:repeat(5,1fr)}}
.cell{aspect-ratio:1;max-width:100%;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px dashed var(--line);color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.cell.on{border:0;box-shadow:0 3px 8px rgba(0,0,0,.08)}
.cell.on svg{width:56%;height:56%;fill:#fff}
.cell.study{background:var(--gold)} .cell.write{background:var(--mint)} .cell.special{background:var(--coral)}
.cell.new{animation:pop .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.2) rotate(-30deg)}100%{transform:scale(1) rotate(0)}}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;font-size:13px;color:var(--muted);font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:6px;background:var(--surface);padding:5px 12px 5px 8px;border-radius:999px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.done-banner{margin-top:14px;text-align:center;font-family:var(--display);font-size:22px;color:var(--pink-ink);background:var(--pink);border-radius:16px;padding:10px}
.sample-tag{position:absolute;top:14px;right:14px;background:var(--surface)}

/* award panel */
.week{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.meter{display:flex;gap:4px}
.meter i{width:22px;height:10px;border-radius:5px;background:var(--sunk)}
.meter i.f{background:var(--accent)}
.agroup{border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--sunk)}
.agroup.study{background:var(--butter)} .agroup.write{background:var(--sky)} .agroup.special{background:var(--pink)}
.agroup.study .ahead .small{color:var(--butter-ink)} .agroup.write .ahead .small{color:var(--sky-ink)} .agroup.special .ahead .small{color:var(--pink-ink)}
.agroup textarea{background:var(--surface)}
.agroup.special > .btn{background:var(--surface);color:var(--pink-ink)}
.ahead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ahead h3{display:flex;align-items:center;gap:8px}
.abtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.abtn{border:0;background:var(--surface);border-radius:16px;padding:13px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;box-shadow:0 2px 6px rgba(0,0,0,.04)}
.abtn b{font-size:16px}
.abtn span{font-size:12px;color:var(--muted)}
.abtn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.abtn:not(:disabled):hover{transform:translateY(-1px)}
.confirm{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:20px;padding:14px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 10px 28px rgba(0,0,0,.22);z-index:4}
.confirm p{margin:0;flex:1;min-width:180px;font-weight:700}
.confirm .btn:not(.primary){background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg)}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.li:first-child{border-top:0}
.li .main{flex:1;min-width:140px}
.li .main b{display:block}
.ico{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
.ico svg{width:58%;height:58%;fill:#fff}
.ico.sm{width:28px;height:28px}
.ico.study{background:var(--gold)} .ico.write{background:var(--mint)} .ico.special{background:var(--coral)}
.li.del{opacity:.5}
.li.del b{text-decoration:line-through}

/* admin */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{border-radius:20px;padding:16px;background:var(--surface)}
.tiles .tile:nth-child(1){background:var(--accent-soft)}
.tiles .tile:nth-child(2){background:var(--sky)}
.tiles .tile:nth-child(3){background:var(--butter)}
.tiles .tile:nth-child(4){background:var(--pink)}
.tile b{display:block;font-family:var(--display);font-size:30px;font-weight:400;font-variant-numeric:tabular-nums;margin-top:2px}
.tile span{font-size:12px;color:var(--muted);font-weight:700}
.tablewrap{overflow-x:auto;border-radius:20px;background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:700;background:var(--accent-soft);border-bottom:0}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.trow{cursor:pointer}
tr.trow:hover td{background:var(--sunk)}
tr.sub td{background:var(--sunk);font-size:13px}
.heat{display:flex;gap:3px}
.heat i{width:24px;height:22px;border-radius:6px;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;background:var(--sunk);color:var(--muted);font-variant-numeric:tabular-nums}
tr.sub .heat i{background:var(--surface)}
.heat i.h1{background:color-mix(in srgb,var(--accent) 28%,var(--surface));color:var(--ink)}
.heat i.h2{background:color-mix(in srgb,var(--accent) 60%,var(--surface));color:var(--ink)}
.heat i.h3,tr.sub .heat i.h3{background:var(--accent);color:var(--accent-ink)}
tr.sub .heat i.h1{background:color-mix(in srgb,var(--accent) 28%,var(--surface))}
tr.sub .heat i.h2{background:color-mix(in srgb,var(--accent) 60%,var(--surface))}
.heat i.fut,tr.sub .heat i.fut{background:transparent;border:1px dashed var(--line)}
.wkhead{display:flex;gap:3px}
.wkhead i{width:24px;font-style:normal;font-size:10px;text-align:center;color:var(--muted)}

.modal{position:fixed;inset:0;background:rgba(20,30,15,.55);z-index:30;display:grid;place-items:center;padding:16px}
.modal-in{background:var(--surface);border-radius:24px;padding:18px;max-width:440px;width:100%;max-height:calc(100% - 32px);overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal-in img{border-radius:16px;width:100%;display:block}
.busy{position:fixed;inset:0;z-index:35;background:color-mix(in srgb,var(--bg) 40%,transparent);display:grid;place-items:center;cursor:progress}
.busy span{background:var(--surface);padding:10px 20px;border-radius:999px;font-weight:700;font-size:14px;box-shadow:var(--shadow)}
/* events */
.evlist{display:flex;flex-direction:column;gap:10px}
.evcard{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;cursor:pointer;border:2px solid transparent;text-align:left}
.evcard[aria-pressed="true"]{border-color:var(--accent)}
.evcard .row{gap:6px}
.evcard h3{font-size:19px}
.pill.scope-all{background:var(--accent);color:var(--accent-ink)}
.pill.scope-d{background:var(--sky);color:var(--sky-ink)}
.pill.live{background:var(--accent-soft);color:var(--ok)}
.pill.soon{background:var(--butter);color:var(--butter-ink)}
.evbanner{border-radius:20px;padding:14px 16px;background:linear-gradient(120deg,var(--butter),var(--pink));display:flex;flex-direction:column;gap:8px}
.evbanner .bar{height:10px;border-radius:5px;background:color-mix(in srgb,var(--surface) 70%,transparent);overflow:hidden}
.evbanner .bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.evbanner .pill:not(.scope-all):not(.scope-d){background:var(--surface)}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.group-h{font-size:13px;font-weight:700;color:var(--muted);padding:12px 0 2px}
.viewsel{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
.vbtn{flex:0 0 auto;border:2px solid transparent;background:var(--surface);border-radius:14px;padding:8px 12px;font-weight:700;display:flex;align-items:center;gap:6px;box-shadow:var(--shadow);font-size:14px}
.vbtn[aria-pressed="true"]{border-color:var(--accent)}
.vs{font-size:11px;padding:2px 7px;border-radius:999px}
.vs.all{background:var(--accent);color:var(--accent-ink)} .vs.d{background:var(--sky);color:var(--sky-ink)}
.evhead{border-radius:24px;padding:16px 18px;background:linear-gradient(120deg,var(--butter),var(--pink));display:flex;flex-direction:column;gap:8px}
.evhead h2{font-size:24px}
.evhead .bar{height:12px;border-radius:6px;background:color-mix(in srgb,var(--surface) 70%,transparent);overflow:hidden}
.evhead .bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.evhead .pill:not(.scope-all):not(.scope-d){background:var(--surface)}
.chk{border:0;border-radius:12px;padding:9px 14px;font-weight:700;background:var(--sunk);color:var(--muted);min-width:96px}
.chk[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.navbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.navbar .btn{background:var(--surface);box-shadow:var(--shadow)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mcard{border:2px solid transparent;background:var(--surface);border-radius:20px;padding:14px;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:7px;align-items:flex-start;min-width:0}
.mcard:hover{border-color:var(--accent)}
.mcard.full{background:var(--accent-soft)}
.mcard .nm{font-family:var(--display);font-size:21px;line-height:1.2;max-width:100%;overflow-wrap:anywhere}
.mcard .mini{display:block;width:100%;height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.mcard .mini i{display:block;height:100%;background:var(--gold);border-radius:4px}
.mcard.full .mini{background:var(--surface)}
.vs.mine,.pill.mine{background:var(--lav,#E6E1FA);color:var(--lav-ink,#5B4BB7)}
.vbtn.add{background:transparent;box-shadow:none;border:2px dashed var(--line);color:var(--muted)}
.evhead.mine{background:linear-gradient(120deg,var(--lav,#E6E1FA),var(--sky))}
.mcard.off{opacity:.55}
.pickchips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{border:0;border-radius:999px;padding:7px 14px;font-weight:700;background:var(--sunk);color:var(--muted)}
.pchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.brand h1{white-space:nowrap}
.brand{flex-wrap:wrap}
.row > .field{min-width:140px}
.tbtn small{color:inherit!important;opacity:.75}
.notes{background:var(--pink);border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.notes h3{font-size:18px;display:flex;align-items:center;gap:8px;color:var(--pink-ink)}
.notes ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.notes li{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:10px 12px}
.notes .nt{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}
.notes .small{color:var(--muted)}
@media (prefers-reduced-motion:reduce){.cell.new{animation:none}.abtn:hover{transform:none}}
</style>

<header class="top">

const API_URL = 'https://script.google.com/macros/s/AKfycbzV-eugqcorSvcfRMmpbUxRg8qdvLuh7ybhWsphIkBh8jxfEQLxT1f85OAECnLnTYUe/exec';

<script>

function makeCore(st) {

  var CAT = {
    study2: { g: 'study', n: 2 }, study1: { g: 'study', n: 1 },
    write2: { g: 'write', n: 2 }, write1: { g: 'write', n: 1 },

  function byId(sheet, id) { return st.all(sheet).filter(function (x) { return x.id === id; })[0]; }

  function pubT(t) { return { id: t.id, district: String(t.district), name: String(t.name), active: isActive(t), createdAt: +t.createdAt || 0 }; }
  function pubE(e) { return { id: e.id, name: String(e.name), scope: String(e.scope || 'all'), start: String(e.start), end: String(e.end), goal: +e.goal || 30, createdBy: String(e.createdBy || ''), createdAt: +e.createdAt || 0 }; }

    var mem = 'all'; try { if (b.members && b.members !== 'all') mem = JSON.parse(b.members); } catch (e) { mem = 'all'; }

  function events() { return st.all('Events').filter(isActive).map(pubE).sort(function (a, b) { return a.start < b.start ? 1 : a.start > b.start ? -1 : 0; }); }

  function memberViews(members, awards) {

    var ms = st.all('Members').filter(function (m) { return m.teacherId === t.id; });
    var since = kstDate(Date.now() - 60 * 864e5);

  function adminAuth(r, masterOnly) {
    var a;
    if (r.aid === 'master') { if (!st.adminPw()) fail('마스터 비밀번호가 설정되지 않았어요.'); a = { id: 'master', name: '마스터', master: true, district: masterDistrict() }; }

    memberActive: function (r) {

    award: function (r) {
      var t = teacherAuth(r);

        var used = list.reduce(function (s, a) { return s + (+a.n || 0); }, 0);
        if (c.g !== 'special' && list.some(function (a) { return CAT[a.cat] && CAT[a.cat].g === c.g; })) fail('이번 주에 이미 지급한 스티커예요.');

        if (!byId('Events', r.eid) && !(bd && bd.teacherId === t.id)) fail('스티커판을 찾을 수 없어요.');
        var ex = parseExtra(m.extra), n = Math.max(0, Math.min(10, (+ex[r.eid] || 0) + (+r.delta < 0 ? -1 : 1)));
        if (n) ex[r.eid] = n; else delete ex[r.eid];
        m.extra = JSON.stringify(ex); st.update('Members', m);
        return mePayload(t);
      });
    },

    boardSave: function (r) {
      var t = teacherAuth(r);
      var name = clean(r.name, 30); if (!name) fail('스티커판 이름을 입력해 주세요.');

      if (end && (!isYmd(end) || end < r.start)) fail('종료일을 확인해 주세요.');

    teacherActive: function (r) {

    eventSave: function (r) {

      return st.locked(function () {
        var e = byId('Events', r.id); if (!e) fail('행사를 찾을 수 없어요.');

        return adminPayload(a);
      });
    }
  };
}

const H9 = 9*3600e3, pad = n => String(n).padStart(2,'0');
const kstDate = ts => { const d = new Date(ts + H9); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`; };
const mondayOf = ymd => { const [y,m,d] = ymd.split('-').map(Number); const t = Date.UTC(y,m-1,d); const dow = (new Date(t).getUTCDay()+6)%7; const mt = new Date(t - dow*864e5); return `${mt.getUTCFullYear()}-${pad(mt.getUTCMonth()+1)}-${pad(mt.getUTCDate())}`; };
const weekKey = ts => mondayOf(kstDate(ts));
const addDays = (ymd,n) => { const [y,m,d] = ymd.split('-').map(Number); const t = new Date(Date.UTC(y,m-1,d) + n*864e5); return `${t.getUTCFullYear()}-${pad(t.getUTCMonth()+1)}-${pad(t.getUTCDate())}`; };
const fmtMD = ymd => { const [,m,d] = ymd.split('-'); return `${+m}/${+d}`; };
const fmtTime = ts => { const d = new Date(ts + H9); return `${d.getUTCMonth()+1}/${d.getUTCDate()} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`; };
const weeksBetween = (s,e) => { const out=[]; let w = mondayOf(s); while (w <= e) { out.push(w); w = addDays(w,7); } return out; };

let demoApi = null;
function demoCore(){
  if (demoApi) return demoApi;
  const h = s => { let x = 2166136261; for (let i=0;i<s.length;i++){ x ^= s.charCodeAt(i); x = Math.imul(x,16777619); } return (x>>>0).toString(16); };
  let mem = lsJSON('stk_demo2');
  if (!mem) {
    const now = Date.now();
    mem = {Teachers:[
      {id:'t_demo1', district:'내외지구', name:'김민지', pinHash:h('ht_demo1:1234'), createdAt:now, active:true},
      {id:'t_demo2', district:'중앙지구', name:'이수진', pinHash:h('ht_demo2:1234'), createdAt:now, active:true}
    ], Members:[], Awards:[], Admins:[], Events:[], Attends:[], Boards:[]};
  }
  ['Teachers','Members','Awards','Admins','Events','Attends','Boards'].forEach(k => { mem[k] = mem[k] || []; });
  const save = () => ls.set('stk_demo2', JSON.stringify(mem));
  const st = {
    all: n => mem[n].map(o => ({...o})),
    append: (n,o) => { mem[n].push({...o}); save(); },
    update: (n,o) => { const i = mem[n].findIndex(x=>x.id===o.id); if (i>=0) { mem[n][i] = {...o}; save(); } },
    locked: fn => fn(),
    hash: s => h('h'+s), hmac: s => h('k'+s),
    adminPw: () => DEMO_PW,
    getProp: k => (mem.props || {})[k],
    setProp: (k, v) => { mem.props = mem.props || {}; if (v) mem.props[k] = v; else delete mem.props[k]; save(); }
  };
  return (demoApi = makeCore(st));
}
async function api(action, payload = {}){
  const req = {action, ...payload};
  if (DEMO) {
    await new Promise(r => setTimeout(r, 120));
    const fn = demoCore()[action]; if (!fn) throw new Error('알 수 없는 요청이에요.');
    return JSON.parse(JSON.stringify(fn(req)));
  }
  let res;
  try { res = await fetch(API_URL, {method:'POST', body: JSON.stringify(req)}); }
  catch { throw new Error('서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.'); }
  let data; try { data = await res.json(); } catch { throw new Error('서버 응답을 읽지 못했어요. 앱스스크립트 배포 설정을 확인해 주세요.'); }
  if (!data.ok) throw new Error(data.error || '요청을 처리하지 못했어요.');
  return data;
}

  const size = m.size || 30, n = seq.length, extra = +(m.extra?.[e.id] || 0);
  let need = Math.max(1, Math.ceil(n/size));
  if (n > 0 && n % size === 0 && evStatus(e) === 'live') need++;
  const count = Math.max(need, Math.ceil(n/size) + extra, 1 + extra);
  const pre = e.kind === 'event' ? '행사판' : '판';
  const boards = Array.from({length:count}, (_,i) => ({label:`${pre} ${i+1}`, cur: seq.slice(i*size, (i+1)*size), size}));
  const lastEmpty = boards.length > 1 && boards[boards.length-1].cur.length === 0;
  return {boards, n, size, extra, canRemove: extra > 0 && lastEmpty};

    <div class="sec-title"><div><h2>회원 선택</h2><div class="small muted">${list.length}명 · 이번 주 아직 스티커 없는 회원 ${zero}명</div></div>

    ${shown.length ? `<div class="mgrid">${shown.map(m => {
      const ws = weekState(m, wk);
      const st = ws.used >= WEEK_MAX ? 'full' : ws.used === 0 ? 'zero' : '';
      const v = gv ? viewFor(m) : null;
      let bar, line;
      if (gv && !v) { bar = 0; line = '이 판 대상 아님'; }
      else if (v) { const n = evBoards(m, v).n; bar = Math.round(Math.min(1, n/v.goal)*100); line = `${esc(v.name)} ${n}/${v.goal}`; }
      else { const b = boardCells(m); bar = Math.round(b.cur.length/b.size*100); line = `${b.boardNo}번째 판 ${b.cur.length}/${b.size}`; }
      return `<button class="mcard ${st}${gv && !v ? ' off' : ''}" data-act="sel" data-v="${m.id}">

        <span class="mini"><i style="width:${bar}%"></i></span>
        <span class="small muted num">${line}</span>
        <span class="pill num ${st==='full'?'ok':st==='zero'?'warn':''}">${st==='full' ? '이번 주 완료' : st==='zero' ? '이번 주 아직' : `이번 주 ${ws.used}/${WEEK_MAX}`}</span>
      </button>`; }).join('')}</div>`
      : `<div class="card empty">‘${esc(q)}’ 회원이 없어요.</div>`}
  </div>`;
}
function notesCard(m, ev){
  const list = m.awards.filter(a => a.cat === 'special' && a.note && (!ev || (kstDate(a.at) >= ev.start && kstDate(a.at) <= rEnd(ev)))).sort((a,b)=>b.at-a.at);
  if (!list.length) return '';
  return `<div class="notes"><h3>선생님 칭찬 한마디 <span class="small num">${list.length}개</span></h3>
    <ul>${list.slice(0,5).map(a => `<li><span class="ico sm special">${svg('special')}</span><span class="nt">${esc(a.note)}</span><span class="small num">${fmtMD(kstDate(a.at))}</span></li>`).join('')}</ul>
    ${list.length > 5 ? `<div class="small">전체는 ‘기록’ 탭에서 볼 수 있어요</div>` : ''}</div>`;
}
function boardView(){

// ----- admin helpers -----
const admDistricts = () => S.adm.districts || uniq(S.adm.teachers.map(t=>t.district));
function admRows(weeks, inRange, onlyDistrict){
  const groups = {};
  S.adm.teachers.forEach(t => {
    if (onlyDistrict && t.district !== onlyDistrict) return;
    if (!onlyDistrict && S.aDistrict !== 'all' && t.district !== S.aDistrict) return;
    groups[t.id] = {t, members:[], sum:0, removed:0, gaps:0};
  });
  const nowWk = weekKey(Date.now());
  S.adm.members.forEach(m => {
    const g = groups[m.teacherId]; if (!g) return;
    const aw = m.awards.filter(a => inRange(a.at));
    const perW = weeks.map(w => aw.filter(a=>a.wk===w).reduce((s,a)=>s+(CAT[a.cat]?.n||0),0));
    const sum = perW.reduce((s,x)=>s+x,0);
    const removed = m.removed.filter(a => inRange(a.at)).length;
    const zeroW = m.active ? weeks.filter((w,i)=> w < nowWk && perW[i]===0).length : 0;
    g.members.push({m, perW, sum, removed, zeroW}); g.sum += sum; g.removed += removed; if (zeroW >= 2) g.gaps++;
  });
  return Object.values(groups)
    .filter(g => g.t.active || g.members.some(r=>r.sum>0))
    .map(g => { g.members.sort((a,b)=>b.sum-a.sum); return g; })
    .sort((a,b)=> a.t.district.localeCompare(b.t.district,'ko') || a.t.name.localeCompare(b.t.name,'ko'));
}
function heat(perW, weeks){
  const nowWk = weekKey(Date.now());
  return `<div class="heat">${perW.map((x,i)=> weeks[i] > nowWk ? `<i class="fut" title="${fmtMD(weeks[i])} 주"></i>` : `<i class="${x>=5?'h3':x>=3?'h2':x>0?'h1':''}" title="${fmtMD(weeks[i])} 주">${x}</i>`).join('')}</div>`;
}
const wkHead = weeks => `<div class="wkhead">${weeks.map(w=>`<i>${fmtMD(w)}</i>`).join('')}</div>`;
function districtFilter(){
  const ds = admDistricts(); if (!ds.length) return '';
  const mine = S.adm.me.district;
  return `<div style="width:200px"><select id="adf" data-in="aDistrict" aria-label="지구 선택"><option value="all" ${S.aDistrict==='all'?'selected':''}>전체 지구</option>${ds.map(d=>`<option value="${esc(d)}" ${S.aDistrict===d?'selected':''}>${esc(d)}${d===mine?' (내 지구)':''}</option>`).join('')}</select></div>`;
}
function groupTable(groups, weeks, opt){
  const cols = 6;
  return `<div class="tablewrap"><table>
    <thead><tr><th>지구 · 선생님</th><th class="n">회원</th><th>${opt.event ? '주별 스티커' : '최근 '+weeks.length+'주'}<br>${wkHead(weeks)}</th><th class="n">합계</th><th class="n">${opt.event ? '시상 대상' : '공백 회원'}</th><th class="n">취소</th></tr></thead>
    <tbody>${groups.length ? groups.map(g => {
      const open = S.open[g.t.id];
      const avgW = weeks.map((_,i)=> g.members.length ? Math.round(g.members.reduce((s,r)=>s+r.perW[i],0)/g.members.length) : 0);
      const elig = g.members.filter(r => r.sum >= (opt.goal||1e9)).length;
      const sub = !open ? '' : (g.members.length ? g.members.map(r => `<tr class="sub"><td>· ${esc(r.m.name)}${r.m.active?'':' <span class="pill">숨김</span>'}</td><td></td><td>${heat(r.perW, weeks)}</td><td class="n">${r.sum}</td>
          <td class="n">${opt.event ? (r.sum >= opt.goal ? '<span class="pill ok">대상</span>' : `<span class="pill">${r.sum}/${opt.goal}</span>`) : (r.zeroW>=2 ? `<span class="pill bad">${r.zeroW}주 0개</span>` : '')}</td>
          <td class="n">${r.removed ? `<span class="pill warn">${r.removed}</span>` : ''}</td></tr>`).join('')
        : `<tr class="sub"><td colspan="${cols}" class="muted">등록된 회원이 없어요.</td></tr>`);
      return `<tr class="trow" data-act="toggleT" data-v="${g.t.id}"><td><b>${open?'▾':'▸'} ${esc(g.t.district)} · ${esc(g.t.name)}</b>${g.t.active?'':' <span class="pill">사용 중지</span>'}</td><td class="n">${g.members.length}</td>
        <td><span class="small muted">회원 평균</span>${heat(avgW, weeks)}</td><td class="n">${g.sum}</td>
        <td class="n">${opt.event ? elig : (g.gaps ? `<span class="pill bad">${g.gaps}명</span>` : '0')}</td><td class="n">${g.removed||''}</td></tr>${sub}`;
    }).join('') : `<tr><td colspan="${cols}" class="muted">해당하는 선생님이 없어요.</td></tr>`}</tbody>
  </table></div>`;
}

// ----- admin: recent -----
function recentView(){
  const nowWk = weekKey(Date.now());
  const weeks = Array.from({length:RECENT_WEEKS},(_,i)=>addDays(nowWk, -7*(RECENT_WEEKS-1-i)));
  const start = weeks[0], end = addDays(nowWk,6);
  const groups = admRows(weeks, at => { const d = kstDate(at); return d >= start && d <= end; });
  const all = groups.flatMap(g=>g.members);
  const thisW = all.reduce((s,r)=>s+r.perW[r.perW.length-1],0);
  const active = all.filter(r=>r.m.active);
  const gaps = active.filter(r=>r.zeroW>=2).length;
  return `<div class="stack">
    <div class="sec-title"><div><h2>평소 현황</h2><div class="small muted">${fmtMD(start)} ~ ${fmtMD(end)} · 최근 ${RECENT_WEEKS}주</div></div>${districtFilter()}</div>
    <div class="tiles">
      <div class="tile"><span>선생님</span><b>${groups.length}</b></div>
      <div class="tile"><span>회원</span><b>${active.length}</b></div>
      <div class="tile"><span>이번 주 스티커</span><b>${thisW}</b></div>
      <div class="tile"><span>2주 이상 공백</span><b>${gaps}</b></div>
    </div>
    ${groupTable(groups, weeks, {event:false})}
    <p class="small muted" style="margin:0">칸 숫자는 그 주에 붙인 스티커 수(주 최대 ${WEEK_MAX}개)예요. 선생님 행을 누르면 회원별로 펼쳐져요. <span class="pill bad">공백</span>은 지난 주 중 0개인 주가 2주 이상인 회원이에요.</p>
  </div>`;
}

function attendMap(eid){ const o = {}; (S.adm.attends||[]).forEach(a => { if (a.eventId===eid) o[a.memberId] = a; }); return o; }
function eventDetail(e){
  const weeks = weeksBetween(e.start, e.end);
  const inR = at => { const x = kstDate(at); return x >= e.start && x <= e.end; };
  const groups = admRows(weeks, inR, e.scope === 'all' ? null : e.scope);
  const all = groups.flatMap(g => g.members.map(r => ({...r, t:g.t})));
  const elig = all.filter(r => r.sum >= e.goal).sort((a,b)=>b.sum-a.sum);
  const att = attendMap(e.id);
  const attN = all.filter(r => att[r.m.id]).length, eligAtt = elig.filter(r => att[r.m.id]).length;
  const q = S.attQ.trim();
  let rows = S.attFilter === 'elig' ? elig : S.attFilter === 'done' ? all.filter(r=>att[r.m.id]) : [...all].sort((a,b)=>b.sum-a.sum);
  if (q) rows = rows.filter(r => r.m.name.includes(q) || r.t.name.includes(q));
  return `<div class="stack">
    <div class="sec-title"><div><div class="row">${scopePill(e.scope)}${statusPill(e)}</div><h2 style="margin-top:6px">${esc(e.name)}</h2><div class="small muted num">${fmtMD(e.start)} ~ ${fmtMD(e.end)} · ${weeks.length}주 · ${e.goal}개 이상 시상</div></div>${e.scope==='all' ? districtFilter() : ''}</div>

        <div style="flex:1;min-width:140px;max-width:240px"><input type="text" id="attq" data-in="attQ" value="${esc(S.attQ)}" placeholder="아이·선생님 이름 검색" aria-label="이름 검색"></div>
      </div>
      ${rows.length ? `<div class="list">${rows.map(r => { const a = att[r.m.id]; return `<div class="li">
          <div class="main"><b>${esc(r.m.name)} ${r.sum >= e.goal ? '<span class="pill ok">대상</span>' : ''}</b><span class="small muted">${esc(r.t.district)} · ${esc(r.t.name)} 선생님 · <span class="num">${r.sum}개</span>${a ? ` · ${fmtTime(a.at)} ${esc(a.by)}` : ''}</span></div>
          <button class="chk" aria-pressed="${!!a}" data-act="attend" data-v="${r.m.id}">${a ? '참여 완료' : '참여 체크'}</button></div>`; }).join('')}</div>`
        : `<div class="empty">${q ? '검색 결과가 없어요.' : S.attFilter==='elig' ? `기간 안에 ${e.goal}개 이상 모은 회원이 여기에 나타나요.` : S.attFilter==='done' ? '아직 참여 체크한 회원이 없어요.' : '해당 회원이 없어요.'}</div>`}
      <div class="row" style="justify-content:flex-end"><button class="btn sm" data-act="copyList" ${elig.length?'':'disabled'}>시상 명단 복사</button><button class="btn sm" data-act="csv">전체 CSV</button></div>
    </div>
    ${groupTable(groups, weeks, {event:true, goal:e.goal})}
  </div>`;
}

// ---------- image export ----------
async function makeImage(spec){
  try { await Promise.all([document.fonts.load('40px Jua'), document.fonts.load('700 20px "Noto Sans KR"')]); } catch {}
  const W = 1080, gap = 18, padX = 80, headH = 300, multi = spec.boards.length > 1, labelH = multi ? 64 : 0, boardGap = 56;
  const geo = spec.boards.map(bd => { const cols = bd.size===50 ? 10 : 6, rows = Math.ceil(bd.size/cols), cellW = (W - padX*2 - gap*(cols-1)) / cols; return {cols, rows, cellW, h: labelH + rows*cellW + (rows-1)*gap}; });
  const gridsH = geo.reduce((s,g)=>s+g.h,0) + boardGap*(geo.length-1);
  const notes = spec.notes || [];
  const mctx = document.createElement('canvas').getContext('2d'); mctx.font = '700 34px "Noto Sans KR", sans-serif';
  const noteMax = W - padX*2 - 110;

function exportSpec(m){

}

function fileSave(name, text, mime){
  const blob = new Blob([text], {type:mime});
  (async () => {
    let dl = null; try { dl = window.claude?.use ? await window.claude.use('downloads') : null; } catch {}
    if (dl) { try { await dl.save({filename:name, data:blob}); } catch(e){ if (e?.code!=='declined') toast('저장하지 못했어요'); } return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  })();
}

      if (!f.name.trim()) { toast('교사명을 입력해 주세요'); return; }
      if (!f.id && !/^\d{4}$/.test(f.pin)) { toast('PIN 숫자 4자리를 정해 주세요'); return; }
      if (f.id && f.pin && !/^\d{4}$/.test(f.pin)) { toast('PIN은 숫자 4자리예요'); return; }
      run('저장 중…', async () => { applyAdmin(await api('teacherSave', {...A(), ...f})); toast(f.id ? '수정했어요' : `${f.district} · ${f.name} 선생님을 등록했어요`); S.tForm = {id:'', district:f.district, name:'', pin:''}; S.teachers = (await api('init')).teachers; });
      break;
    }
    case 'tEdit': { const t = S.adm.teachers.find(x=>x.id===v); if (t) { S.tForm = {id:t.id, district:t.district, name:t.name, pin:''}; render(); window.scrollTo(0,0); } break; }
    case 'tFormReset': S.tForm = null; render(); break;
    case 'tOffAsk': S.tConfirm = v; render(); break;
    case 'tOffNo': S.tConfirm = null; render(); break;
    case 'tOffYes': run('저장 중…', async () => { applyAdmin(await api('teacherActive', {...A(), tid:v, active:false})); S.tConfirm = null; toast('사용 중지했어요'); }); break;
    case 'tOn': run('저장 중…', async () => { applyAdmin(await api('teacherActive', {...A(), tid:v, active:true})); }); break;
    // admins (master)
    case 'adAdd': {
      const f = S.adForm;
      if (!f.name.trim()) { toast('관리자 이름을 입력해 주세요'); return; }
      if (f.pw.length < 4) { toast('비밀번호는 4자 이상이에요'); return; }
      run('저장 중…', async () => { applyAdmin(await api('adminAdd', {...A(), name:f.name, pw:f.pw, district:f.district||''})); toast(`${f.name} 관리자를 추가했어요`); S.adForm = {name:'', pw:'', district:''}; S.admins = (await api('init')).admins; });
      break;
    }
    case 'adEditAsk': { S.adEdit = v; S.adDel = null; S.adEditVal = v === 'master' ? (S.adm.me.master ? S.adm.me.district : '') : ((S.adm.admins||[]).find(x=>x.id===v)?.district || ''); render(); setTimeout(()=>document.getElementById('ade')?.focus(),0); break; }
    case 'adEditNo': S.adEdit = null; render(); break;
    case 'adEditSave': {
      run('저장 중…', async () => { applyAdmin(await api('adminDistrict', {...A(), id:v, district:S.adEditVal||''})); if (v === 'master') S.aDistrict = S.adm.me.district || 'all'; S.adEdit = null; S.admins = (await api('init')).admins; toast('담당 지구를 저장했어요'); });
      break;
    }
    case 'adDelAsk': S.adDel = v; render(); break;
    case 'adDelNo': S.adDel = null; render(); break;
    case 'adDelYes': run('삭제 중…', async () => { applyAdmin(await api('adminRemove', {...A(), id:v})); S.adDel = null; S.admins = (await api('init')).admins; toast('관리자를 삭제했어요'); }); break;
  }
}

// ---------- events ----------
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const stop = e.target.closest('[data-stop]');
  if (stop && !stop.contains(t)) return;
  act(t.dataset.act, t.dataset.v, e.target);
});
document.addEventListener('input', e => {
  const k = e.target.dataset?.in; if (!k) return;
  let v = e.target.value;
  if (e.target.classList.contains('pin')) { v = v.replace(/\D/g,'').slice(0,4); e.target.value = v; }
  const [root, sub] = k.split('.');
  if (sub) {
    if (root === 'login') { S.login[sub] = v; if (sub === 'district') { S.login.pick = null; render(); } }
    else if (root === 'evForm') { S.evForm[sub] = v; if (e.target.type === 'date' || e.target.tagName === 'SELECT') render(); }
    else if (root === 'tForm') { if (!S.tForm) { const ds0 = admDistricts(), defD = S.aDistrict !== 'all' ? S.aDistrict : (S.adm.me.district || ''); S.tForm = {id:'', district: ds0.includes(defD) ? defD : '', name:'', pin:''}; } S.tForm[sub] = v; }
    else if (root === 'adForm') { S.adForm[sub] = v; }
    else if (root === 'bForm') { S.bForm[sub] = v; }
  } else { S[k] = v; if (k === 'recFilter' || k === 'aDistrict' || k === 'attQ' || k === 'memberQ') render(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList?.contains('evcard')) { act('evPick', e.target.dataset.v, e.target); return; }
  if (e.key !== 'Enter' || !e.target.dataset?.in) return;
  const k = e.target.dataset.in;
  if (k === 'login.pin') act('login'); else if (k === 'login.pw') act('adminLogin'); else if (k === 'addName') act('addMember');
});

boot();
})();

</script>
</body>
</html>
