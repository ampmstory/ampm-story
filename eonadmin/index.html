<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>AMPM STORY 관리</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500&family=Noto+Sans+KR:wght@400;500&display=swap">
<style>
:root{--bg:#F3EEFA;--surface:#FFFFFF;--line:#E6DFF0;--ink:#2A2438;--muted:#6E6680;--accent:#7A64B0;--accent-ink:#FFFFFF;--soft:#EDE6F8;
--head:"IBM Plex Sans KR","Noto Sans KR",sans-serif;--sans:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#17141E;--surface:#201C2A;--line:#363044;--ink:#F1ECFA;--muted:#ABA2BD;--accent:#B3A0E6;--accent-ink:#1B1626;--soft:#2E2740;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--sans);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.box{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:32px 28px;text-align:center}
.logo{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin-bottom:20px}
.logo b{font-family:var(--head);font-size:26px;font-weight:500;letter-spacing:.08em}
.logo span{font-size:10px;letter-spacing:.42em;color:var(--accent);margin-top:5px;padding-left:.42em}
h1{font-family:var(--head);font-weight:400;font-size:20px;margin:0 0 8px;letter-spacing:-.02em}
p{color:var(--muted);font-size:14px;line-height:1.7;margin:0 0 24px}
.btn{display:block;padding:14px;border-radius:10px;font-weight:500;font-size:15px;text-decoration:none;margin-bottom:10px}
.main{background:var(--accent);color:var(--accent-ink)}
.sub{border:1px solid var(--line);color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
ul{list-style:none;padding:16px;margin:18px 0 0;background:var(--soft);border-radius:10px;text-align:left;font-size:13px;color:var(--muted);line-height:1.8}
ul b{color:var(--ink);font-weight:500}
small{display:block;margin-top:14px;font-size:12px;color:var(--muted)}
small a{color:var(--accent)}
</style>
</head>
<body>
<main class="box">
  <div class="logo"><b>AMPM</b><span>STORY</span></div>
  <h1>상품 관리</h1>
  <p>초대받은 계정으로 로그인한 뒤<br>상품을 추가하거나 수정할 수 있어요.</p>
  <a class="btn main" href="https://app.pagescms.org/ampmstory/ampm-story/main/content/products">상품 관리 열기</a>
  <a class="btn sub" href="https://ampmstory.com/" target="_blank" rel="noopener">사이트 확인하기</a>
  <ul>
    <li><b>이미지</b> 정사각 · 500KB 이하 · 파일명 영문</li>
    <li><b>가격</b> 숫자만 입력 (6000 → 6,000원)</li>
    <li><b>링크</b> 판매처 없으면 칸 비우기</li>
    <li><b>예시 상품 표시</b> 항상 끄기</li>
    <li><b>저장</b> Save 후 1~2분 뒤 반영</li>
  </ul>
  <small>상품 관리 화면이 안 열리면 <a href="https://app.pagescms.org">app.pagescms.org</a>에서 로그인하세요.</small>
</main>
</body>
</html>
