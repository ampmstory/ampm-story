<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>중국어 발음 듣기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&family=Noto+Sans+SC:wght@500;700&display=swap">
<style>
/* Layout: 플래너와 같은 초록·분홍 톤. 묶음 버튼(성조/DAY/부록) → 탭 → 카드, 아래 고정 재생 상태바 */
:root {
  --bg: #F7FAF8; --surface: #FFFFFF; --tint: #EEF7F4; --line: #CDE6DF; --pinkt: #FBF1EE;
  --green: #3E8E7E; --green-d: #24675A; --pink: #C9604F; --pink-d: #93402F;
  --fg: #3A403E; --sub: #707A76; --on-accent: #FFFFFF;
  --f-ko: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-ja: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #181C18; --surface: #222822; --tint: #26332A; --line: #3A4A3D; --pinkt: #33282C;
  --green: #6FC2B0; --green-d: #A3DDD0; --pink: #E58A7B; --pink-d: #F2B0A5;
  --fg: #EEF2EC; --sub: #AEB8AC; --on-accent: #181C18; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #181C18; --surface: #222822; --tint: #26332A; --line: #3A4A3D; --pinkt: #33282C;
  --green: #6FC2B0; --green-d: #A3DDD0; --pink: #E58A7B; --pink-d: #F2B0A5;
  --fg: #EEF2EC; --sub: #AEB8AC; --on-accent: #181C18; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--f-ko); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 96px }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
.wrap { max-width: 860px; margin: 0 auto }
header.top { padding-block: 22px 8px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; justify-content: space-between }
.brand small { display: block; font-size: 12px; letter-spacing: .06em; color: var(--green-d); font-weight: 600 }
.brand h1 { margin: 2px 0 0; font-size: 23px; font-weight: 800; text-wrap: balance }
.speed { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--sub) }
.seg { display: inline-flex; background: var(--tint); border-radius: 999px; padding: 3px }
.seg button { border: 0; background: transparent; color: var(--sub); font: 600 13px var(--f-ko); padding: 6px 12px; border-radius: 999px; cursor: pointer }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--green-d); box-shadow: 0 1px 3px rgba(0,0,0,.08) }
nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 8px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin }
nav.tabs a { flex: 0 0 auto; text-decoration: none; color: var(--green-d); background: var(--tint); border: 1px solid var(--line);
  padding: 7px 12px; border-radius: 12px; font-weight: 600; font-size: 13.5px; white-space: nowrap }
nav.tabs a .n { font-size: 11px; opacity: .8; margin-right: 5px; font-variant-numeric: tabular-nums }
nav.tabs a[aria-current="page"] { background: var(--green); color: var(--on-accent); border-color: var(--green) }
.notice { margin: 8px 0 2px; padding: 11px 14px; border-radius: 12px; background: var(--pinkt); font-size: 13.5px }
.notice b { color: var(--pink-d) }
h2 { font-size: 19px; margin: 16px 0 10px; display: flex; gap: 8px; align-items: center; text-wrap: balance }
h2 .pill { font-size: 12px; background: var(--green); color: var(--on-accent); padding: 2px 10px; border-radius: 999px; flex: 0 0 auto }
.stack { display: grid; gap: 10px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center }
.card .num { width: 26px; height: 26px; border-radius: 50%; background: var(--pink); color: var(--on-accent); display: grid; place-items: center; font-size: 13px; font-weight: 800; flex: 0 0 auto }
.card .body { flex: 1 1 260px; min-width: 0 }
.jp { font-family: var(--f-ja); font-size: 22px; font-weight: 700; line-height: 1.35 }
.yomi { font-family: var(--f-ja); font-size: 14px; color: var(--sub) }
.rom { font-size: 13.5px; color: var(--sub) }
.rom b { color: var(--fg); font-weight: 600 }
.mean { font-size: 14px; color: var(--pink-d); font-weight: 700 }
.btns { display: flex; gap: 6px; flex: 0 0 auto }
.play { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 12px; padding: 10px 14px;
  background: var(--green); color: var(--on-accent); font: 700 14px var(--f-ko); cursor: pointer; min-height: 44px }
.play.ghost { background: var(--tint); color: var(--green-d) }
.play.on { box-shadow: 0 0 0 3px var(--pink) }
.play:focus-visible, nav.tabs a:focus-visible, .seg button:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px }
.times { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px }
.times div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px }
.times b { color: var(--pink-d) } .times small { color: var(--sub); display: block; font-size: 12.5px }
.talk { background: var(--tint); border-radius: 16px; padding: 14px 16px; display: grid; gap: 10px }
.talk .head { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center }
.talk h3 { margin: 0; font-size: 15px; color: var(--green-d) }
.line { display: flex; gap: 10px; align-items: flex-start }
.sp { flex: 0 0 auto; font-size: 12px; font-weight: 700; color: var(--green-d); background: var(--surface); border-radius: 999px; padding: 3px 10px; margin-top: 4px }
.line .jp { font-size: 18px }
.line.on .jp { color: var(--pink-d) }
.tip { font-size: 13.5px } .tip b { color: var(--pink-d); margin-right: 6px }
.status { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); font-size: 13px; color: var(--sub) }
.status .in { max-width: 860px; margin: 0 auto; display: flex; gap: 8px 14px; flex-wrap: wrap; align-items: center }
.status b { color: var(--fg); font-family: var(--f-ja) }
.status select { font: 13px var(--f-ko); padding: 4px 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); max-width: 220px }
footer.src { margin-top: 18px; font-size: 12px; color: var(--sub) }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }

.groups { display: flex; gap: 6px; padding-top: 6px }
.groups button { border: 1px solid var(--line); background: var(--surface); color: var(--green-d); font: 700 13px var(--f-ko); padding: 6px 14px; border-radius: 999px; cursor: pointer }
.groups button[aria-pressed="true"] { background: var(--pink); border-color: var(--pink); color: var(--on-accent) }
.hz { font-family: var(--f-ja); font-size: 40px; font-weight: 700; line-height: 1.1; min-width: 52px; text-align: center }
.py { font-size: 17px; font-weight: 700; color: var(--pink-d) }
.meta { font-size: 13px; color: var(--sub) } .meta b { color: var(--green-d) }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px }
.quiz { background: var(--tint); border-radius: 16px; padding: 14px 16px; display: grid; gap: 10px; margin-top: 12px }
.quiz .opts { display: flex; flex-wrap: wrap; gap: 8px }
.quiz .opts button { min-width: 64px }
.quiz .res { font-size: 14px; min-height: 22px } .quiz .res b { color: var(--pink-d) }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><small>14일 완성 중국어 쓰기 플래너</small><h1>중국어 발음 듣기</h1></div>
    <div class="speed">속도
      <div class="seg" role="group" aria-label="재생 속도">
        <button type="button" id="sp-normal" data-rate="0.85" aria-pressed="true">보통</button>
        <button type="button" id="sp-slow" data-rate="0.55" aria-pressed="false">느리게</button>
      </div>
    </div>
  </header>
  <div class="groups" role="group" aria-label="묶음">
    <button type="button" data-group="tone">성조</button><button type="button" data-group="d">DAY 1~14</button><button type="button" data-group="a">회화 부록</button>
  </div>
  <nav class="tabs" id="tabs" aria-label="페이지"></nav>
  <div class="notice" id="voice-note">노트의 DAY · 부록 번호와 같은 탭이에요. 듣고 소리 내어 따라 읽은 뒤, 노트에 써 보세요.</div>
  <main id="panel"></main>
  <footer class="src">휴대폰 · 태블릿에 들어 있는 중국어 음성으로 읽어 줘요. 기기마다 목소리가 조금 다를 수 있어요. 여러 발음이 있는 한자는 기기 음성이 다른 발음으로 읽을 수도 있으니, 노트의 병음을 기준으로 익혀 주세요.<br><a href="https://ampmstory.com/" style="color:inherit">AMPM STORY</a></footer>
</div>
<div class="status" role="status">
  <div class="in"><span id="st-msg">재생 준비 완료</span><span>음성: <select id="voice" aria-label="중국어 음성 선택"></select></span></div>
</div>

  const groupOf = k => k === "tone" ? "tone" : k[0];
  function drawTabs(cur) {
    $("#tabs").innerHTML = TABS[group].map(([k, l]) => `<a href="#${k}" data-tab="${k}"${k === cur ? ' aria-current="page"' : ""}>${l}</a>`).join("");
    document.querySelectorAll(".groups button").forEach(b => b.setAttribute("aria-pressed", b.dataset.group === group));
    document.querySelector('#tabs a[aria-current="page"]')?.scrollIntoView({ block: "nearest", inline: "nearest" });
  }
  const sayBtns = (t) => `<div class="btns"><button class="play" type="button" data-say="${esc(t)}">▶ 듣기</button><button class="play ghost" type="button" data-say="${esc(t)}" data-rate="0.5">느리게</button></div>`;
  function talkBox(title, lines, key) {
    return `<div class="talk"><div class="head"><h3>${esc(title)}</h3><button class="play" type="button" data-talk="${key}">▶ 대화 이어 듣기</button></div>
      ${lines.map((t, i) => `<div class="line" data-line="${key}-${i}"><span class="sp">${esc(t.sp)}</span>
        <div style="min-width:0;flex:1"><div class="jp" lang="zh-CN">${esc(t.hz)}</div><div class="rom">${esc(t.py)} · <b>${esc(t.mean)}</b></div></div>
        <button class="play ghost" type="button" data-say="${esc(t.hz)}" aria-label="${esc(t.mean)} 듣기">▶</button></div>`).join("")}</div>`;
  }
  const TALKS = {};
  let Q = null;
  function renderTone() {
    let h = `<h2><span class="pill">성조</span>같은 ma, 다섯 가지 소리</h2><div class="stack">` + DATA.tones.map(t => `
      <div class="card"><div class="hz" lang="zh-CN">${esc(t.hz)}</div>
        <div class="body"><div class="py">${esc(t.py)} <span class="meta">${esc(t.name)} · ${esc(t.how)}</span></div><div class="mean">${esc(t.mean)}</div></div>${sayBtns(t.hz)}</div>`).join("") + `</div>`;
    h += `<div class="quiz"><h3 style="margin:0;font-size:15px;color:var(--green-d)">성조 맞히기 게임</h3>
      <div class="meta">노트의 100자 중 한 글자를 읽어 줘요. 몇 성인지 골라 보세요. (여러 발음이 있는 글자는 뺐어요)</div>
      <div><button class="play" type="button" id="q-new">▶ 문제 듣기</button> <button class="play ghost" type="button" id="q-again">다시 듣기</button></div>
      <div class="opts">${[1, 2, 3, 4].map(n => `<button class="play ghost" type="button" data-ans="${n}">${n}성</button>`).join("")}</div>
      <div class="res" id="q-res" aria-live="polite">‘문제 듣기’를 눌러 시작해요.</div><div class="meta" id="q-score">맞힌 개수 0 / 0</div></div>`;
    $("#panel").innerHTML = h;
  }
  let score = [0, 0];
  function renderDay(x) {
    let h = `<h2><span class="pill">DAY ${p2(x.d)}</span>${esc(x.topic)}</h2><div class="grid2">` + x.chars.map(c => `
      <div class="card"><div class="hz" lang="zh-CN">${esc(c.hz)}</div>
        <div class="body"><div class="py">${esc(c.py)}</div><div class="mean">${esc(c.mean)}</div>
        <div class="meta">${c.trad ? `번체 <b lang="zh-TW">${esc(c.trad)}</b> · ` : ""}훈음 <b>${esc(c.hun)}</b></div></div>${sayBtns(c.hz)}</div>`).join("") + `</div>`;
    h += `<h2 style="font-size:16px">단어</h2><div class="stack">` + x.words.map((w, i) => `
      <div class="card"><span class="num">${i + 1}</span><div class="body"><div class="jp" lang="zh-CN">${esc(w.hz)}</div>
        <div class="rom">${esc(w.py)}${w.rd ? ` · 읽을 때 <b>${esc(w.rd)}</b>` : ""}</div><div class="mean">${esc(w.mean)}</div></div>${sayBtns(w.hz)}</div>`).join("") + `</div>`;
    $("#panel").innerHTML = h;
  }
  function renderAppx(p) {
    const key = "a" + p2(p.no);
    let h = `<h2><span class="pill">부록 ${p2(p.no)}</span>${esc(p.title)}</h2>`;
    if (p.expr.length) h += `<div class="stack">` + p.expr.map((e, i) => `
      <div class="card"><span class="num">${i + 1}</span><div class="body"><div class="jp" lang="zh-CN">${esc(e.hz)}</div>
        <div class="rom">${esc(e.py)}</div><div class="mean">${esc(e.mean)}</div></div>${sayBtns(e.hz)}</div>`).join("") + `</div>`;
    if (p.times) h += `<h2 style="font-size:16px">언제 쓸까?</h2><div class="times">` + p.times.map(t =>
      `<div><b>${esc(t[0])}</b> <small>${esc(t[1])}</small><span class="jp" lang="zh-CN" style="font-size:18px">${esc(t[2])}</span></div>`).join("") + `</div>`;
    if (p.talk.length) { TALKS[key] = p.talk; h += `<h2 style="font-size:16px">짧은 대화</h2>` + talkBox("말하며 읽어 보는 대화", p.talk, key); }
    (p.reviews || []).forEach((r, k) => { const kk = key + "r" + k; TALKS[kk] = r.talk; h += `<h2 style="font-size:16px">대화 · ${esc(r.title)}</h2>` + talkBox("처음부터 끝까지 이어 들어 보세요", r.talk, kk); });
    if (p.tip && p.tip.length) h += `<div class="stack" style="margin-top:10px">` + p.tip.map(t => `<div class="tip"><b>TIP</b>${esc(t)}</div>`).join("") + `</div>`;
    $("#panel").innerHTML = h;
  }
  function loadVoices() {
    if (!synth) return;
    const all = synth.getVoices().filter(v => /^(zh|cmn)/i.test(v.lang));
    voices = all.filter(v => /CN|Hans/i.test(v.lang)).concat(all.filter(v => !/CN|Hans/i.test(v.lang)));
    const sel = $("#voice");
    sel.innerHTML = voices.length ? voices.map((v, i) => `<option value="${i}">${esc(v.name)} (${esc(v.lang)})</option>`).join("") : `<option>기본 음성</option>`;
    voice = voices[0] || null;
    if (!voices.length) $("#voice-note").innerHTML = "<b>이 기기에서 중국어 음성을 찾지 못했어요.</b> 아이폰 · 아이패드는 설정 → 손쉬운 사용 → 읽기 및 말하기 → 음성에서 중국어(중국 본토) 음성을 추가할 수 있어요.";
  }
  if (synth) { loadVoices(); synth.onvoiceschanged = loadVoices; }
  else $("#voice-note").innerHTML = "<b>이 브라우저는 음성 재생을 지원하지 않아요.</b> Safari나 Chrome 최신 버전에서 열어 주세요.";
  $("#voice").addEventListener("change", e => { voice = voices[+e.target.value] || null; });
  let onBtn = null;
  function clearOn() { if (onBtn) onBtn.classList.remove("on"); document.querySelectorAll(".line.on").forEach(l => l.classList.remove("on")); }
  function speak(items, btn) {
    if (!synth) return;
    synth.cancel(); clearOn(); onBtn = btn; if (btn) btn.classList.add("on");
    items.forEach((it, i) => {
      const u = new SpeechSynthesisUtterance(it.text);
      u.lang = "zh-CN"; u.rate = it.rate || rate; if (it.voice || voice) u.voice = it.voice || voice; if (it.pitch) u.pitch = it.pitch;
      u.onstart = () => { $("#st-msg").innerHTML = it.hide ? "재생 중" : `재생 중 <b>${esc(it.text)}</b>`; document.querySelectorAll(".line.on").forEach(l => l.classList.remove("on")); if (it.line) document.querySelector(`[data-line="${it.line}"]`)?.classList.add("on"); };
      u.onend = () => { if (i === items.length - 1) { clearOn(); $("#st-msg").textContent = "재생 끝 · 소리 내어 따라 읽어 보세요"; } };
      u.onerror = () => { clearOn(); $("#st-msg").textContent = "재생하지 못했어요. 화면을 한 번 누른 뒤 다시 시도해 보세요."; };
      synth.speak(u);
    });
  }
  document.addEventListener("click", e => {
    const g = e.target.closest(".groups button");
    if (g) { group = g.dataset.group; const first = TABS[group][0][0]; show(first); return; }
    if (e.target.closest("#q-new")) { Q = DATA.quiz[Math.floor(Math.random() * DATA.quiz.length)]; $("#q-res").textContent = "몇 성일까요?"; return speak([{ text: Q.hz, hide: true }], e.target.closest("button")); }
    if (e.target.closest("#q-again")) { if (Q) speak([{ text: Q.hz, hide: true }], e.target.closest("button")); return; }
    const a = e.target.closest("[data-ans]");
    if (a) { if (!Q) { $("#q-res").textContent = "먼저 ‘문제 듣기’를 눌러요."; return; }
      score[1]++; const ok = +a.dataset.ans === Q.t; if (ok) score[0]++;
      $("#q-res").innerHTML = (ok ? "정답이에요! " : "아쉬워요. ") + `<b lang="zh-CN">${esc(Q.hz)}</b> ${esc(Q.py)} · ${Q.t}성`;
      $("#q-score").textContent = `맞힌 개수 ${score[0]} / ${score[1]}`; Q = null; return; }
    const b = e.target.closest("[data-say],[data-talk]");
    if (!b) return;
    if (b.dataset.say) return speak([{ text: b.dataset.say, rate: b.dataset.rate ? +b.dataset.rate : null }], b);
    const lines = TALKS[b.dataset.talk] || [];
    const roles = [...new Set(lines.map(l => l.sp))];
    speak(lines.map((l, i) => {
      const r = roles.indexOf(l.sp);
      const v = voices.length > 1 ? voices[(voices.indexOf(voice) + r) % voices.length] : voice;
      return { text: l.hz, line: `${b.dataset.talk}-${i}`, voice: v, pitch: voices.length > 1 ? 1 : (r ? 1.2 : 1) };
    }), b);
  });
  document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
    rate = +b.dataset.rate;
    document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === b));
    try { localStorage.setItem("zh-rate", b.id); } catch (_) {}
  }));
  try { const r = localStorage.getItem("zh-rate"); if (r) document.getElementById(r)?.click(); } catch (_) {}
  function show(key) {
    if (synth) synth.cancel();
    if (key === "tone") { group = "tone"; renderTone(); }
    else if (/^d\d\d$/.test(key) && DATA.days[+key.slice(1) - 1]) { group = "d"; renderDay(DATA.days[+key.slice(1) - 1]); }
    else if (/^a\d\d$/.test(key) && DATA.appx[+key.slice(1) - 1]) { group = "a"; renderAppx(DATA.appx[+key.slice(1) - 1]); }
    else { key = "tone"; group = "tone"; renderTone(); }
    drawTabs(key);
  }
  $("#tabs").addEventListener("click", e => { const a = e.target.closest("a[data-tab]"); if (!a) return; e.preventDefault(); show(a.dataset.tab); window.scrollTo({ top: 0 }); });
  show((location.hash || "#tone").slice(1));
  window.addEventListener("hashchange", () => show((location.hash || "#tone").slice(1)));
})();
</script>
</body>
</html>
