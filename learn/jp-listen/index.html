<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>일본어 회화 발음 듣기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&family=Noto+Sans+JP:wght@500;700&display=swap">
<style>
/* Layout: 플래너 회화 부록과 같은 초록·분홍 톤. 상단 부록 탭 → 표현 카드 → 대화 박스, 아래 고정 재생 상태바 */
:root {
  --bg: #FBFCF9; --surface: #FFFFFF; --tint: #EEF6EC; --line: #CFE3CC; --pinkt: #FDF1F3;
  --green: #6FAE7B; --green-d: #3F7A4B; --pink: #E57F91; --pink-d: #B9465C;
  --fg: #3B3A37; --sub: #737A72; --on-accent: #FFFFFF;
  --f-ko: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-ja: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #181C18; --surface: #222822; --tint: #26332A; --line: #3A4A3D; --pinkt: #33282C;
  --green: #85C391; --green-d: #A8D9B1; --pink: #EE93A3; --pink-d: #F4A9B6;
  --fg: #EEF2EC; --sub: #AEB8AC; --on-accent: #181C18; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #181C18; --surface: #222822; --tint: #26332A; --line: #3A4A3D; --pinkt: #33282C;
  --green: #85C391; --green-d: #A8D9B1; --pink: #EE93A3; --pink-d: #F4A9B6;
  --fg: #EEF2EC; --sub: #AEB8AC; --on-accent: #181C18; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--f-ko); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 96px }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
.wrap { max-width: 860px; margin: 0 auto }
header.top { padding-block: 22px 8px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; justify-content: space-between }
.brand small { display: block; font-size: 12px; letter-spacing: .06em; color: var(--green-d); font-weight: 600 }
.brand h1 { margin: 2px 0 0; font-size: 23px; font-weight: 800; text-wrap: balance }
.speed { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--sub) }
.seg { display: inline-flex; background: var(--tint); border-radius: 999px; padding: 3px }
.seg button { border: 0; background: transparent; color: var(--sub); font: 600 13px var(--f-ko); padding: 6px 12px; border-radius: 999px; cursor: pointer }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--green-d); box-shadow: 0 1px 3px rgba(0,0,0,.08) }
nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 8px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin }
nav.tabs a { flex: 0 0 auto; text-decoration: none; color: var(--green-d); background: var(--tint); border: 1px solid var(--line);
  padding: 7px 12px; border-radius: 12px; font-weight: 600; font-size: 13.5px; white-space: nowrap }
nav.tabs a .n { font-size: 11px; opacity: .8; margin-right: 5px; font-variant-numeric: tabular-nums }
nav.tabs a[aria-current="page"] { background: var(--green); color: var(--on-accent); border-color: var(--green) }
.notice { margin: 8px 0 2px; padding: 11px 14px; border-radius: 12px; background: var(--pinkt); font-size: 13.5px }
.notice b { color: var(--pink-d) }
h2 { font-size: 19px; margin: 16px 0 10px; display: flex; gap: 8px; align-items: center; text-wrap: balance }
h2 .pill { font-size: 12px; background: var(--green); color: var(--on-accent); padding: 2px 10px; border-radius: 999px; flex: 0 0 auto }
.stack { display: grid; gap: 10px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center }
.card .num { width: 26px; height: 26px; border-radius: 50%; background: var(--pink); color: var(--on-accent); display: grid; place-items: center; font-size: 13px; font-weight: 800; flex: 0 0 auto }
.card .body { flex: 1 1 260px; min-width: 0 }
.jp { font-family: var(--f-ja); font-size: 22px; font-weight: 700; line-height: 1.35 }
.yomi { font-family: var(--f-ja); font-size: 14px; color: var(--sub) }
.rom { font-size: 13.5px; color: var(--sub) }
.rom b { color: var(--fg); font-weight: 600 }
.mean { font-size: 14px; color: var(--pink-d); font-weight: 700 }
.btns { display: flex; gap: 6px; flex: 0 0 auto }
.play { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 12px; padding: 10px 14px;
  background: var(--green); color: var(--on-accent); font: 700 14px var(--f-ko); cursor: pointer; min-height: 44px }
.play.ghost { background: var(--tint); color: var(--green-d) }
.play.on { box-shadow: 0 0 0 3px var(--pink) }
.play:focus-visible, nav.tabs a:focus-visible, .seg button:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px }
.times { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px }
.times div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px }
.times b { color: var(--pink-d) } .times small { color: var(--sub); display: block; font-size: 12.5px }
.talk { background: var(--tint); border-radius: 16px; padding: 14px 16px; display: grid; gap: 10px }
.talk .head { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center }
.talk h3 { margin: 0; font-size: 15px; color: var(--green-d) }
.line { display: flex; gap: 10px; align-items: flex-start }
.sp { flex: 0 0 auto; font-size: 12px; font-weight: 700; color: var(--green-d); background: var(--surface); border-radius: 999px; padding: 3px 10px; margin-top: 4px }
.line .jp { font-size: 18px }
.line.on .jp { color: var(--pink-d) }
.tip { font-size: 13.5px } .tip b { color: var(--pink-d); margin-right: 6px }
.status { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); font-size: 13px; color: var(--sub) }
.status .in { max-width: 860px; margin: 0 auto; display: flex; gap: 8px 14px; flex-wrap: wrap; align-items: center }
.status b { color: var(--fg); font-family: var(--f-ja) }
.status select { font: 13px var(--f-ko); padding: 4px 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); max-width: 220px }
footer.src { margin-top: 18px; font-size: 12px; color: var(--sub) }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand"><small>14일 완성 일본어 쓰기 플래너 · 여행 기초회화 부록</small><h1>회화 발음 듣기</h1></div>
    <div class="speed">속도
      <div class="seg" role="group" aria-label="재생 속도">
        <button type="button" id="sp-normal" data-rate="0.9" aria-pressed="true">보통</button>
        <button type="button" id="sp-slow" data-rate="0.6" aria-pressed="false">느리게</button>
      </div>
    </div>
  </header>
  <nav class="tabs" id="tabs" aria-label="부록 페이지"></nav>
  <div class="notice" id="sound-tip"><b>소리가 안 나면</b> ① 아이폰 무음 모드를 끄고(옆면 스위치나 제어 센터의 종 모양) ② 음량 버튼으로 소리를 올린 뒤 ③ 아래 버튼으로 확인해 보세요. <button class="play ghost" type="button" id="sound-test" style="min-height:36px;padding:6px 12px;margin-left:4px">▶ 소리 테스트</button></div>
  <div class="notice" id="voice-note">노트의 부록 번호와 같은 탭이에요. 들은 뒤 소리 내어 따라 읽고, 노트에 써 보세요.</div>
  <main id="panel"></main>
  <footer class="src">기기에 들어 있는 일본어 음성으로 읽어 줘요. 한글 발음은 참고용이고, 기기마다 목소리가 조금 다를 수 있어요.<br><a href="https://ampmstory.com/" style="color:inherit">AMPM STORY</a></footer>
</div>

<div class="status" role="status">
  <div class="in"><span id="st-msg">재생 준비 완료</span><span>음성: <select id="voice" aria-label="일본어 음성 선택"></select></span></div>
</div>

(function () {

  function loadVoices() {
